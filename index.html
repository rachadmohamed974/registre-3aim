<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registre de sécurité – 3AIM CFA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#12213F;--orange:#E87722;--gold:#F5A623;--red:#C62828;--red-d:#7A0E0E;--grad:linear-gradient(100deg,#5E0A0A 0%,#9B1515 45%,#D32F2F 100%);
  --bg:#F3F4F6;--card:#FFFFFF;--ink:#14213D;--ink2:#4B5563;--ink3:#8A93A3;--line:#E3E6EB;
  --ok:#1E7F4F;--okbg:#E5F3EB;--warn:#A86400;--warnbg:#FDF1DC;--bad:#B42318;--badbg:#FCE8E6;--none:#6B7280;--nonebg:#EEF0F3;
  --r-inst:#1F5FA8;--r-lev:#D99A00;--r-epi:#E87722;--r-inc:#C62828;--r-form:#1E7F4F;--r-obs:#5B6474;--r-id:#12213F;
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1525;--card:#16203A;--ink:#EEF1F6;--ink2:#B7C0CF;--ink3:#7E8AA0;--line:#26324D;
  --okbg:#14372A;--ok:#6FD3A0;--warnbg:#3D2E12;--warn:#F5B94F;--badbg:#3E1A1A;--bad:#F28B82;--nonebg:#232E47;--none:#A3AEC2;color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Barlow,"Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.5;color:var(--ink);background:var(--bg)}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-weight:600;line-height:1.15;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--grad);color:#fff;border-bottom:3px solid var(--gold)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;background:#5E0A0A}
.top .in{max-width:1180px;margin:auto;display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.mark{width:36px;height:36px;border-radius:7px;background:var(--orange);display:grid;place-items:center;font-family:"Barlow Condensed";font-weight:700;font-size:17px;color:#fff}
.brand b{font-family:"Barlow Condensed";font-size:20px;font-weight:600;display:block;line-height:1}
.brand small{color:#C9D2E3;font-size:12.5px}
.top .sp{flex:1}
.top .who{font-size:13px;color:#C9D2E3}
.btn{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:8px 13px;display:inline-flex;align-items:center;gap:7px;font-weight:500;font-size:14px;transition:background .15s}
.btn:hover{background:var(--bg)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.pri:hover{background:#A31515}
.btn.dk{background:transparent;border-color:rgba(255,255,255,.45);color:#fff}
.btn.dk:hover{background:rgba(255,255,255,.14)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.wrap{max-width:1180px;margin:auto;padding:22px 18px 60px}
.demo{background:var(--warnbg);color:var(--warn);text-align:center;font-size:13px;padding:6px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px}
.hint{color:var(--ink2);font-size:13.5px}
.grid{display:grid;gap:14px}
/* tableau de bord */
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin:16px 0 22px}
.kpi{padding:14px 16px;border-left:5px solid var(--c,var(--navy));border-radius:0 10px 10px 0}
.kpi .n{font-family:"Barlow Condensed";font-size:34px;font-weight:700;line-height:1}
.kpi .l{color:var(--ink2);font-size:13px}
.layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px}
.sec-h h2{font-size:22px}
.ents{display:grid;gap:10px}
.ent{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.ent:hover{border-color:var(--ink3)}
.ent .nm{font-weight:600;font-size:16px}
.ent .al{font-size:13px;margin-top:2px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pill{font-size:12px;padding:2px 8px;border-radius:20px;font-weight:500;white-space:nowrap}
.p-ok{background:var(--okbg);color:var(--ok)}.p-bientot{background:var(--warnbg);color:var(--warn)}.p-retard,.p-nc{background:var(--badbg);color:var(--bad)}.p-vide{background:var(--nonebg);color:var(--none)}
/* jauge = étiquette de contrôle */
.gauge{--v:0;--gc:var(--ok);width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--gc) calc(var(--v)*1%),var(--line) 0);display:grid;place-items:center;position:relative}
.gauge::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--card)}
.gauge span{position:relative;z-index:1;font-family:"Barlow Condensed";font-weight:700;font-size:19px}
.gauge.big{width:118px;height:118px}.gauge.big::after{inset:11px}.gauge.big span{font-size:34px}
.opp{padding:14px 16px;border-top:4px solid var(--orange)}
.opp li{margin:6px 0;font-size:14px}
.opp .to{color:var(--orange);font-weight:600}
.feed{padding:6px 14px;max-height:360px;overflow:auto}
.feed div{padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.feed div:last-child{border:0}
.feed small{color:var(--ink3);display:block}
/* fiche entreprise */
.hero{display:grid;grid-template-columns:240px minmax(0,1fr) auto;gap:20px;padding:18px;align-items:center}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}.photo{max-width:320px}}
.photo{aspect-ratio:4/3;border-radius:8px;border:2px dashed var(--line);display:grid;place-items:center;overflow:hidden;background:var(--bg);color:var(--ink3);font-size:13px;text-align:center;cursor:pointer;position:relative}
.photo img{width:100%;height:100%;object-fit:cover}
.photo.has{border-style:solid}
.photo .chg{position:absolute;bottom:6px;right:6px;background:rgba(18,33,63,.82);color:#fff;font-size:12px;padding:3px 8px;border-radius:5px}
.hero h1{font-size:32px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:4px 18px;margin-top:8px;font-size:14px}
.meta span{color:var(--ink3)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid var(--line);margin-top:6px}
.tab{border:0;background:none;padding:10px 13px 9px;border-bottom:4px solid transparent;margin-bottom:-2px;white-space:nowrap;font-weight:500;color:var(--ink2);display:flex;align-items:center;gap:7px}
.tab .dot{width:10px;height:10px;border-radius:3px;background:var(--rc)}
.tab.on{color:var(--ink);border-bottom-color:var(--rc)}
.tab .ct{font-size:12px;background:var(--bg);border-radius:10px;padding:0 7px}
.tab .ct.alert{background:var(--badbg);color:var(--bad)}
.panel{margin-top:16px}
.rubh{display:flex;align-items:center;gap:12px;padding:14px 16px;border-left:6px solid var(--rc);border-radius:0 10px 10px 0;margin-bottom:12px;flex-wrap:wrap}
.rubh h2{font-size:24px}
.rubh p{margin:2px 0 0;font-size:13px;color:var(--ink2)}
.rubh .sp{flex:1}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.chip{border:1px dashed var(--ink3);background:transparent;border-radius:20px;padding:4px 11px;font-size:13px;color:var(--ink2)}
.chip:hover{border-style:solid;border-color:var(--rc);color:var(--ink)}
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:6px minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 12px 10px 0;overflow:hidden}
.row .bar{align-self:stretch;background:var(--sc)}
.row .t{font-weight:600}
.row .d{font-size:13px;color:var(--ink2)}
.row .k{font-size:12px;color:var(--ink3)}
.row .bt{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:760px){.row{grid-template-columns:6px minmax(0,1fr);}.row>*:nth-child(n+3){grid-column:2}.row .bt{justify-content:flex-start}}
.empty{padding:26px;text-align:center;color:var(--ink2)}
.res{padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border-left:5px solid var(--sc);border-radius:0 10px 10px 0}
.res.done{opacity:.7}
/* modale */
.ov{position:fixed;inset:0;background:rgba(10,16,30,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal{width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--card);border-radius:12px;border-top:6px solid var(--rc,var(--red))}
.modal header{padding:16px 20px 6px;display:flex;justify-content:space-between;align-items:center}
.modal header h2{font-size:24px}
.modal .bd{padding:6px 20px 8px;display:grid;gap:12px}
.modal footer{padding:12px 20px 18px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
label.f{display:grid;gap:4px;font-size:13px;color:var(--ink2);font-weight:500}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);border-radius:7px;padding:9px 10px;background:var(--card);font-size:15px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--card);padding:9px 6px;font-weight:500;font-size:14px}
.seg button.on[data-v="C"]{background:var(--ok);color:#fff}.seg button.on[data-v="R"]{background:var(--warn);color:#fff}.seg button.on[data-v="NC"]{background:var(--bad);color:#fff}
.calc{background:var(--bg);border-radius:8px;padding:10px 12px;font-size:14px}
.err{color:var(--bad);font-size:13px;min-height:18px}
/* connexion */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--grad)}
.lbox{width:min(420px,100%);background:var(--card);border-radius:14px;overflow:hidden}
.lbox .hd{padding:26px 26px 18px;border-bottom:4px solid var(--red)}
.lbox .hd h1{font-size:34px}
.lbox .bd{padding:22px 26px 26px;display:grid;gap:14px}
.stripes{height:8px;background:repeating-linear-gradient(135deg,#F5A623 0 14px,#7A0E0E 14px 28px)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--red-d);color:#fff;padding:10px 18px;border-radius:8px;z-index:60;font-size:14px;max-width:90vw}
.qr{display:grid;place-items:center;padding:8px;background:#fff;border-radius:8px;width:max-content;margin:auto}
.mono{font-family:Consolas,"Courier New",monospace;background:var(--bg);padding:2px 7px;border-radius:5px}
.modal.wide{width:min(1180px,100%);height:94vh;display:flex;flex-direction:column}
.modal.wide .bd{flex:1;padding:0 12px;display:flex}
.pv{flex:1;width:100%;min-height:60vh;border:1px solid var(--line);border-radius:8px;background:#525659}
.rg{padding:18px 20px;column-width:300px;column-gap:28px;font-size:14px}
.rg p{margin:0 0 10px;break-inside:avoid}
.rg-h{font-size:19px;color:var(--red);margin:6px 0 8px;break-after:avoid;border-left:4px solid var(--red);padding-left:8px}
.rg-a{color:var(--red)}
.rg-s{font-style:italic;color:var(--ink2);font-size:12.5px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rg-h,:root:not([data-theme="light"]) .rg-a{color:#F28B82}}
.row.du{grid-template-columns:6px minmax(0,1.5fr) 96px minmax(0,1.6fr) 230px}
@media (max-width:760px){.row.du{grid-template-columns:6px minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

async function login(code){
  S.code=code.trim();
  let cached=null;try{cached=JSON.parse(store.get(cacheKey(S.code))||"null")}catch(x){}
  if(cached){applyData(cached);startView();render();showSync(true)}
  try{const r=await api("login",{code:S.code});store.set("reg3aim_code",S.code);
    if(r.ents)applyData(r);else{S.role=r.role;S.entId=r.entId;await reload()}

/* ============ MODULE DUERP ============ */
const DG="#2E7D32",DGD="#1B5E20";
const duList=id=>S.du.filter(d=>d.entId===id).sort((a,b)=>Number(b.version)-Number(a.version));
const duObj=d=>{if(!d._o){try{d._o=JSON.parse(d.data||"{}")}catch(x){d._o={}}d._o.units=d._o.units||[]}return d._o};
const RN=r=>Number(r.g||0)*Number(r.f||0);
const LV=v=>v>=8?"eleve":v>=4?"modere":"faible";
const LVL={faible:["Faible","#1E7F4F","#E5F3EB"],modere:["Modéré","#B26A00","#FDF1DC"],eleve:["Élevé","#B42318","#FCE8E6"]};
const MAI={bonne:"Bonne",moyenne:"Moyenne",insuffisante:"Insuffisante"};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
function newRisk(k){const r=DRK[k];const g=Number(r[5]),f=Number(r[6]),lv=LV(g*f);
  return{id:uid("k"),fam:r[1],d:r[2],s:r[3],dm:r[4],g,f,m:lv==="eleve"?"insuffisante":"moyenne",ex:r[7],ac:r[8],resp:"",dec:today(),delai:lv==="eleve"?3:lv==="modere"?6:12,fait:"",fo:r[9]}}
const echR=r=>r.dec&&r.delai?addM(r.dec,r.delai):"";
async function saveDu(d){const o=duObj(d);const row={id:d.id||"",entId:d.entId,version:d.version,metier:d.metier,date:d.date||"",redacteur:d.redacteur||"",effectif:d.effectif||"",statut:d.statut||"brouillon",data:JSON.stringify(o)};
  const r=await api("saveDuerp",{du:row});const i=S.du.findIndex(x=>x.id===r.du.id);r.du._o=o;if(i>=0)S.du[i]=r.du;else S.du.push(r.du);return r.du}
function duOpps(id){const d=duList(id)[0];if(!d)return[];const seen=new Set(),o=[];
  duObj(d).units.forEach(u=>u.risks.forEach(r=>{if(r.fo&&!r.fait&&!seen.has(r.fo)){seen.add(r.fo);o.push({t:`${r.fo} (DUERP – ${u.nom})`,qui:"Formation 3AIM CFA"})}}));return o}
function panelDuerp(e,pn){
  const L=duList(e.id),ro=S.role==="lecture";
  if(!L.length){
    pn.innerHTML=`<div class="card rubh" style="--rc:${DG}"><div><h2>Document unique (DUERP)</h2><p>Code du travail, articles L.4121-1 à L.4121-3 et R.4121-1 à R.4121-4</p></div></div>
    ${ro?`<div class="card empty">Aucun DUERP n’est encore enregistré.</div>`:`<div class="card" style="padding:18px;display:grid;gap:12px;max-width:640px">
     <h3 style="font-size:20px">Créer le DUERP de ${esc(e.nom)}</h3>
     <label class="f">Métier de l’entreprise<select id="du_m"><option value="">Choisir un métier…</option>${DM.map((m,i)=>`<option value="${i}">${esc(m[0])}</option>`).join("")}<option value="-1">Document vierge</option></select></label>
     <div class="hint" id="du_p">Les unités de travail et les risques types sont pré-remplis : il ne te reste qu’à ajuster sur le terrain.</div>
     <div class="two"><label class="f">Effectif<input id="du_e" type="number" value="${esc(e.effectif||"")}"></label><label class="f">Rédacteur (IPRP)<input id="du_r" value="Rachad MOHAMED – IPRP, 3AIM CFA"></label></div>
     <div class="err" id="du_x"></div><div><button class="btn pri" id="du_c">Créer le DUERP</button></div></div>`}`;
    if(ro)return;
    $("#du_m").onchange=()=>{const v=$("#du_m").value;$("#du_p").innerHTML=v>=0&&v!==""?"Unités pré-remplies : <b>"+DM[v][1].map(k=>esc(DU[k][0])).join(", ")+"</b>":"Les unités de travail et les risques types sont pré-remplis : il ne te reste qu’à ajuster sur le terrain."};
    $("#du_c").onclick=async()=>{const v=$("#du_m").value;if(v===""){$("#du_x").textContent="Choisis un métier ou « Document vierge ».";return}
      const units=v>=0?DM[v][1].map(k=>({id:uid("u"),nom:DU[k][0],eff:"",desc:"",risks:DU[k][1].map(newRisk)})):[];
      const d={entId:e.id,version:1,metier:v>=0?DM[v][0]:"",date:"",redacteur:$("#du_r").value.trim(),effectif:$("#du_e").value,statut:"brouillon",_o:{units}};
      $("#du_c").disabled=true;$("#du_c").textContent="Création…";
      try{await saveDu(d);V.duv=null;V.duu=0;toast("DUERP créé");renderEnt()}catch(z){$("#du_x").textContent=z.message;$("#du_c").disabled=false;$("#du_c").textContent="Créer le DUERP"}};
    return;
  }
  const d=L.find(x=>x.id===V.duv)||L[0],o=duObj(d),U=o.units,ui=Math.min(V.duu||0,Math.max(0,U.length-1)),u=U[ui];
  const all=U.flatMap(x=>x.risks),el=all.filter(r=>LV(RN(r))==="eleve").length,late=all.filter(r=>!r.fait&&echR(r)&&jours(echR(r))<0).length,done=all.filter(r=>r.fait).length;
  const nxt=d.date?addM(d.date,12):"";
  pn.innerHTML=`<div class="card rubh" style="--rc:${DG}"><div><h2>Document unique – version ${esc(d.version)}</h2><p>${esc(d.metier||"Document vierge")} · ${d.statut==="validé"?`validé le ${fr(d.date)} · prochaine mise à jour avant le <b>${fr(nxt)}</b>`:"brouillon, non encore validé"}</p></div><div class="sp"></div>
   ${L.length>1?`<select id="du_v" style="border:1px solid var(--line);border-radius:7px;padding:7px">${L.map(x=>`<option value="${x.id}" ${x.id===d.id?"selected":""}>Version ${esc(x.version)}${x.statut==="validé"?" – "+fr(x.date):" – brouillon"}</option>`).join("")}</select>`:""}
   <button class="btn pri" id="du_pdf">PDF du DUERP</button>${ro?"":`${d.statut!=="validé"?`<button class="btn" id="du_val">Valider</button>`:""}<button class="btn" id="du_nv">Nouvelle version</button><button class="btn ghost" id="du_inf">Infos</button>`}</div>
  <div class="grid kpis" style="margin:0 0 14px">
   <div class="card kpi" style="--c:${DG}"><div class="n">${U.length}</div><div class="l">Unités de travail</div></div>
   <div class="card kpi" style="--c:#B42318"><div class="n" style="color:var(--bad)">${el}</div><div class="l">Risques élevés</div></div>
   <div class="card kpi" style="--c:#C17D00"><div class="n" style="color:var(--warn)">${late}</div><div class="l">Actions en retard</div></div>
   <div class="card kpi" style="--c:#1E7F4F"><div class="n" style="color:var(--ok)">${done} / ${all.length}</div><div class="l">Actions réalisées</div></div></div>
  <div class="quick" style="--rc:${DG}">${U.map((x,i)=>{const m=Math.max(0,...x.risks.map(RN)),c=LVL[LV(m)];return `<button class="chip" data-u="${i}" style="${i===ui?`border-style:solid;border-color:${DG};color:var(--ink);font-weight:600`:""}"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${x.risks.length?c[1]:"#bbb"};margin-right:6px"></span>${esc(x.nom)} · ${x.risks.length}</button>`}).join("")}${ro?"":`<button class="chip" id="du_au">+ Unité de travail</button>`}</div>
  ${u?`<div class="card" style="padding:12px 14px;margin-bottom:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-left:5px solid ${DG};border-radius:0 10px 10px 0"><div style="flex:1;min-width:200px"><b style="font-size:17px">${esc(u.nom)}</b><div class="hint">${esc([u.eff?u.eff+" salarié(s)":"",u.desc].filter(Boolean).join(" · "))}</div></div>
    ${ro?"":`<select id="du_ar" style="border:1px solid var(--line);border-radius:7px;padding:7px;max-width:260px"><option value="">+ Ajouter un risque…</option><option value="__">Risque libre</option>${[...new Set(DR.map(r=>r[1]))].map(f=>`<optgroup label="${esc(f)}">${DR.filter(r=>r[1]===f).map(r=>`<option value="${r[0]}">${esc(r[2])}</option>`).join("")}</optgroup>`).join("")}</select><button class="btn sm ghost" id="du_eu">Modifier l’unité</button>`}</div>
  <div class="rows">${u.risks.slice().sort((a,b)=>RN(b)-RN(a)).map(r=>{const v=RN(r),c=LVL[LV(v)],ec=echR(r),lt=!r.fait&&ec&&jours(ec)<0;return `<div class="card row du" style="--sc:${c[1]}">
    <div class="bar"></div><div><div class="t">${esc(r.d)}</div><div class="d">${esc(r.s)}</div><div class="k">${esc(r.dm)} · existant : ${esc(r.ex||"–")}</div></div>
    <div><span class="pill" style="background:${c[2]};color:${c[1]}">${v} · ${c[0]}</span><div class="k" style="margin-top:4px">G${r.g} × F${r.f}<br>Maîtrise ${(MAI[r.m]||"–").toLowerCase()}</div></div>
    <div><div style="font-size:14px">${esc(r.ac||"")}</div><div class="k">${esc(r.resp||"Responsable à désigner")} · ${r.fait?`<b style="color:var(--ok)">réalisé le ${fr(r.fait)}</b>`:ec?`<span style="color:${lt?"var(--bad)":"inherit"}">avant le ${fr(ec)}</span>`:""}${r.fo?` · <span class="to" style="color:var(--orange)">formation ${esc(r.fo)}</span>`:""}</div></div>
    <div class="bt">${ro?"":`${r.fait?"":`<button class="btn sm" data-ok="${r.id}">Réalisé</button>`}${REG_FAM[r.fam]?`<button class="btn sm ghost" data-rg="${r.id}" title="Suivre dans le registre">→ Registre</button>`:""}<button class="btn sm ghost" data-rk="${r.id}">Modifier</button>`}</div></div>`}).join("")||`<div class="card empty">Aucun risque dans cette unité.</div>`}</div>`:`<div class="card empty">Ajoute une première unité de travail.</div>`}`;
  if($("#du_v"))$("#du_v").onchange=ev=>{V.duv=ev.target.value;V.duu=0;renderEnt()};
  pn.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{V.duu=Number(b.dataset.u);renderEnt()});

function modal(title,color,body,actions){
  const ov=document.createElement("div");ov.className="ov";
  ov.innerHTML=`<div class="modal" role="dialog" aria-modal="true" style="--rc:${color}"><header><h2>${title}</h2><button class="btn ghost sm" data-x aria-label="Fermer">✕</button></header><div class="bd">${body}</div><footer>${actions}</footer></div>`;
  document.body.appendChild(ov);
  const close=()=>{ov.remove();document.removeEventListener("keydown",k)};const k=ev=>{if(ev.key==="Escape")close()};
  document.addEventListener("keydown",k);ov.querySelector("[data-x]").onclick=close;ov.onclick=ev=>{if(ev.target===ov)close()};
  setTimeout(()=>ov.querySelector("input,select,textarea")?.focus(),30);
  return{ov,close,q:s=>ov.querySelector(s)};
}

  g.fillStyle="#fff";g.fillRect(0,0,1240,1748);{const gr=g.createLinearGradient(0,0,1240,0);gr.addColorStop(0,"#5E0A0A");gr.addColorStop(1,"#D32F2F");g.fillStyle=gr;g.fillRect(0,0,1240,330);}g.fillStyle="#F5A623";g.fillRect(0,330,1240,16);
  g.fillStyle="#F5A623";g.font="600 44px Barlow, Arial";g.fillText("3AIM CFA",90,120);g.fillStyle="#fff";g.font="700 96px 'Barlow Condensed', Arial";g.fillText("Registre de sécurité",90,250);
  g.fillStyle="#7A0E0E";g.font="600 60px Barlow, Arial";g.fillText(e.nom.slice(0,32),90,470);
  g.drawImage(qr,270,560,700,700);g.fillStyle="#4B5563";g.font="40px Barlow, Arial";
  ["Scannez pour consulter le registre à jour","(vérifications, formations, réserves)"].forEach((t,i)=>g.fillText(t,620-g.measureText(t).width/2,1350+i*56));

async function apercu(e){
  let doc;try{doc=await buildPDF(e)}catch(x){toast("Aperçu impossible : "+x.message);return}
  const url=URL.createObjectURL(doc.output("blob")),ro=S.role==="lecture";
  const m=modal("Aperçu du registre – "+esc(e.nom),"#B71C1C",`<iframe class="pv" src="${url}#view=FitH" title="Aperçu du registre"></iframe>`,
    `<button class="btn" data-x2>Fermer</button>${ro?"":`<button class="btn" id="p_m">Envoyer par mail</button>`}<button class="btn pri" id="p_d">Télécharger le PDF</button>`);
  m.ov.querySelector(".modal").classList.add("wide");
  m.ov.querySelector("[data-x2]").onclick=()=>{m.close();URL.revokeObjectURL(url)};
  m.q("#p_d").onclick=()=>saveFile(pdfName(e),doc.output("blob"));
  if(m.q("#p_m"))m.q("#p_m").onclick=()=>{m.close();mailForm(e,doc)};
}
function mailForm(e,doc){
  const m=modal("Envoyer le registre par mail","#B71C1C",`
   <label class="f">Destinataire(s)<input id="m_to" type="text" value="${esc(S.role==="admin"?(e.email||""):"")}" placeholder="nom@entreprise.re, autre@entreprise.re"></label>
   <label class="f">Objet<input id="m_su" value="${esc("Registre de sécurité – "+e.nom)}"></label>
   <label class="f">Message<textarea id="m_tx" rows="6">Bonjour,

Veuillez trouver ci-joint le registre de sécurité de ${esc(e.nom)}, à jour au ${fr(today())}.

Il est aussi consultable à tout moment en ligne : ${APP_URL}

Cordialement,
3AIM CFA – ${ORG.tel}</textarea></label>
   <p class="hint" style="margin:0">Le registre complet est joint en PDF. Une copie t’est envoyée.</p><div class="err" id="m_e"></div>`,
   `<button class="btn" data-x2>Annuler</button><button class="btn pri" id="m_s">Envoyer</button>`);
  m.ov.querySelector("[data-x2]").onclick=m.close;
  m.q("#m_s").onclick=async()=>{
    const to=m.q("#m_to").value.split(/[,;\s]+/).filter(Boolean);
    if(!to.length||to.some(a=>!/^\S+@\S+\.\S+$/.test(a))){m.q("#m_e").textContent="Indique une adresse mail valide.";m.q("#m_to").focus();return}
    const b=m.q("#m_s");b.disabled=true;b.textContent="Préparation…";
    try{const d=doc||await buildPDF(e);b.textContent="Envoi…";
      const data=d.output("datauristring").split(",")[1];
      await api("sendRegistre",{entId:e.id,to:to.join(","),subject:m.q("#m_su").value.trim()||"Registre de sécurité",message:m.q("#m_tx").value,name:pdfName(e),data});
      m.close();toast(DEMO?"Mode démo : le mail partira une fois l’outil en ligne":"Registre envoyé à "+to.join(", "));
    }catch(x){b.disabled=false;b.textContent="Envoyer";m.q("#m_e").textContent=x.message}};
}

/* ============ FICHIERS ============ */
async function saveFile(name,blob){
  try{if(window.claude&&window.claude.use){const dl=await window.claude.use("downloads");if(dl){await dl.save({filename:name,data:blob});return}}}catch(x){if(x&&x.code==="declined")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
const dataBlob=u=>{const [h,b]=u.split(","),bin=atob(b),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:h.slice(5).split(";")[0]})};

const toB64=f=>new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]);r.onerror=ko;r.readAsDataURL(f)});
async function uploadFile(e,f,kind){if(f.size>15e6)throw new Error("Fichier trop lourd (15 Mo maximum)");return api("upload",{entId:e.id,kind,name:f.name,mime:f.type||"application/octet-stream",data:await toB64(f)})}
async function uploadPhoto(e,f){
  if(!f)return;if(!f.type.startsWith("image/")){toast("Choisis une image");return}
  const img=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=URL.createObjectURL(f)});
  const k=Math.min(1,1400/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  const url=c.toDataURL("image/jpeg",.85);toast("Envoi de la photo…");
  try{await api("upload",{entId:e.id,kind:"photo",name:"photo_"+e.nom+".jpg",mime:"image/jpeg",data:url.split(",")[1]});S.photos[e.id]=url;e.photoId=e.photoId||"ok";renderEnt();toast("Photo enregistrée")}catch(z){toast(z.message)}
}
/* ============ DÉPÔT INTELLIGENT (lecture automatique) ============ */
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
function deposer(e,f){
  if(!f)return;$("#depf").value="";
  const m=modal("Lecture du document",RUB.id.c,`<div class="calc">${esc(f.name)}</div><p id="d_st" style="margin:0">Envoi du document…</p><div class="err" id="d_e"></div>`,`<button class="btn" data-x2>Annuler</button>`);
  m.ov.querySelector("[data-x2]").onclick=m.close;
  (async()=>{
    let u;try{u=await uploadFile(e,f,"doc")}catch(z){m.q("#d_e").textContent=z.message;return}
    m.q("#d_st").textContent="Lecture automatique du rapport en cours (15 à 30 secondes)…";
    let r=null;
    try{if(f.size>9e6)throw new Error("Fichier trop lourd pour la lecture automatique");
      r=await api("lireDoc",{entId:e.id,name:f.name,mime:f.type||"application/pdf",data:await toB64(f)})}catch(z){r={err:z.message}}
    m.close();
    if(!r||r.err||!r.items||!r.items.length){toast(r&&r.err?"Lecture automatique indisponible : saisie manuelle":"Aucune vérification reconnue : saisie manuelle");return choixManuel(e,u.url)}
    validerLecture(e,r.items,u.url);
  })();
}
function choixManuel(e,url){
  const E=els(e.id);
  const m=modal("Ce document concerne…",RUB.id.c,`<label class="f">Élément du registre<select id="d_el"><option value="">Choisir…</option>${RUBS.filter(r=>CATA[r.k]).map(r=>`<optgroup label="${r.n}">${E.filter(x=>x.rub===r.k).map(x=>`<option value="${x.id}">${esc(x.libelle)}${x.detail?" – "+esc(x.detail):""}</option>`).join("")}<option value="new:${r.k}">+ Nouvel élément (${r.n})</option></optgroup>`).join("")}</select></label><div class="err" id="d_e"></div>`,
   `<button class="btn" data-x2>Annuler</button><button class="btn pri" id="d_s">Continuer</button>`);
  m.ov.querySelector("[data-x2]").onclick=m.close;
  m.q("#d_s").onclick=()=>{const v=m.q("#d_el").value;if(!v){m.q("#d_e").textContent="Choisis l’élément concerné.";return}m.close();
    if(v.startsWith("new:"))elForm(e,{rub:v.slice(4),doc:url,dernier:today(),resultat:v.slice(4)==="form"?"":"C"});
    else{const x=S.els.find(y=>y.id===v);elForm(e,{...x,dernier:today(),resultat:x.rub==="form"?"":"C",ref:"",doc:url},true)}};
}
function trouver(e,it){
  const E=els(e.id).filter(x=>x.rub===it.rub),s=norm(it.serie);
  return (s.length>=4&&E.find(x=>norm(x.detail+" "+x.libelle).includes(s)))||E.find(x=>norm(x.libelle)===norm(it.libelle))||null;
}
function validerLecture(e,items,url){
  const L=items.map((it,i)=>{const ex=trouver(e,it);return{...it,i,ex,per:Number(it.per)||(ex?ex.per:12)}});
  const res=r=>`<span class="pill p-${r==="NC"?"nc":r==="R"?"bientot":"ok"}">${RES[r]||"–"}</span>`;
  const m=modal("Vérifié automatiquement – à valider","#B71C1C",`<p class="hint" style="margin:0">Voici ce que j’ai lu dans le document. Corrige si besoin, puis enregistre : tout est rangé dans la bonne rubrique.</p>
   ${L.map(it=>`<div class="card" style="padding:12px;border-left:5px solid ${RUB[it.rub]?.c||"#5B6474"}">
     <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>${esc(RUB[it.rub]?.n||"")}</b>${it.rub!=="form"?res(it.resultat):""}</div>
     <div class="two" style="margin-top:8px"><label class="f">Élément<input data-k="libelle" data-i="${it.i}" value="${esc(it.libelle)}"></label><label class="f">Précisions<input data-k="detail" data-i="${it.i}" value="${esc(it.detail)}"></label></div>
     <div class="two"><label class="f">Date<input type="date" data-k="dernier" data-i="${it.i}" value="${esc(it.dernier)}"></label><label class="f">Périodicité (mois)<input type="number" min="1" data-k="per" data-i="${it.i}" value="${esc(it.per)}"></label></div>
     <div class="two"><label class="f">Vérifié par<input data-k="organisme" data-i="${it.i}" value="${esc(it.organisme)}"></label><label class="f">N° rapport<input data-k="ref" data-i="${it.i}" value="${esc(it.ref)}"></label></div>
     ${(it.reserves||[]).length?`<div class="hint" style="margin-top:6px"><b>Réserves relevées :</b><br>${it.reserves.map(r=>"• "+esc(r.texte||r)).join("<br>")}</div>`:""}
     <div class="hint" style="margin-top:6px">${it.ex?`Mise à jour de l’élément existant <b>${esc(it.ex.libelle)}</b>`:"Nouvel élément ajouté au registre"}${it.ex&&it.resultat!=="NC"&&ress(e.id).some(r=>r.elId===it.ex.id&&!r.levee)?" · les réserves précédentes de cet équipement seront levées":""}</div></div>`).join("")}<div class="err" id="v_e"></div>`,
   `<button class="btn" data-x2>Annuler</button><button class="btn pri" id="v_s">Enregistrer dans le registre</button>`);
  m.ov.querySelector("[data-x2]").onclick=m.close;
  m.ov.querySelectorAll("[data-k]").forEach(inp=>inp.oninput=()=>{L[inp.dataset.i][inp.dataset.k]=inp.value});
  m.q("#v_s").onclick=async()=>{const b=m.q("#v_s");b.disabled=true;b.textContent="Enregistrement…";
    try{for(const it of L){
        const el={id:it.ex?.id||"",entId:e.id,rub:it.rub,libelle:it.libelle,detail:it.detail||it.ex?.detail||"",per:Number(it.per)||12,dernier:it.dernier,organisme:it.organisme,resultat:it.rub==="form"?"":(it.resultat||""),ref:it.ref,notes:it.notes||"",doc:url};
        const r2=await api("saveEl",{el});const k=S.els.findIndex(y=>y.id===r2.el.id);if(k>=0)S.els[k]=r2.el;else S.els.push(r2.el);
        if(it.ex&&it.resultat!=="NC")for(const o of ress(e.id).filter(r=>r.elId===it.ex.id&&!r.levee)){const x=await api("saveRes",{res:{...o,levee:it.dernier||today(),preuve:"Vérification "+(it.ref||"")+" du "+fr(it.dernier)}});const j=S.res.findIndex(y=>y.id===x.res.id);S.res[j]=x.res}
        const rs=(it.reserves||[]).map(r=>typeof r==="string"?{texte:r}:r);
        if(it.resultat==="NC"&&!rs.some(r=>/contre.?visite/i.test(r.texte)))rs.unshift({texte:"Contre-visite obligatoire avant remise en service",gravite:"haute"});
        for(const r of rs){const x=await api("saveRes",{res:{entId:e.id,elId:r2.el.id,date:it.dernier||today(),texte:`${it.libelle}${it.detail?" ("+it.detail+")":""} : ${r.texte}`,gravite:r.gravite||(it.resultat==="NC"?"haute":"moyenne"),levee:"",preuve:""}});S.res.push(x.res)}
      }
      m.close();toast(L.length>1?`${L.length} vérifications enregistrées`:"Vérification enregistrée");renderEnt();
    }catch(z){b.disabled=false;b.textContent="Enregistrer dans le registre";m.q("#v_e").textContent=z.message}};
}

async function etiquettes(e){await need("jspdf","qr");
  const L=els(e.id).filter(x=>["lev","epi","inst","inc"].includes(x.rub));
  if(!L.length){toast("Aucun équipement à étiqueter");return}
  if(!e.lecture){toast("Code de consultation manquant");return}
  const {jsPDF}=window.jspdf,doc=new jsPDF({unit:"mm",format:"a4"}),lw=95,lh=54,mx=7.5,my=10,gx=5,gy=3.5;
  L.forEach((x,i)=>{const k=i%10;if(i&&!k)doc.addPage();const X=mx+(k%2)*(lw+gx),Y=my+Math.floor(k/2)*(lh+gy);
    doc.setDrawColor(200,205,214);doc.setLineWidth(.3);doc.roundedRect(X,Y,lw,lh,2.5,2.5);
    for(let j=0;j<40;j++){const t=j/39;doc.setFillColor(Math.round(94+(211-94)*t),Math.round(10+(47-10)*t),Math.round(10+(47-10)*t));doc.rect(X+lw*j/40,Y,lw/40+.2,9,"F")}
    doc.setTextColor(255,255,255);doc.setFont("helvetica","bold");doc.setFontSize(8.5);doc.text("Registre de sécurité",X+4,Y+6);
    doc.setFont("helvetica","normal");doc.setFontSize(7);doc.setTextColor(255,225,200);doc.text("3AIM CFA",X+lw-4,Y+6,{align:"right"});
    doc.addImage(qrData(`${APP_URL}/?c=${e.lecture}&m=${x.id}`),"PNG",X+lw-37,Y+12,34,34);
    doc.setTextColor(20,33,61);doc.setFont("helvetica","bold");doc.setFontSize(10);doc.text(doc.splitTextToSize(P(x.libelle),54).slice(0,2),X+4,Y+16);
    doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(75,85,99);doc.text(doc.splitTextToSize(P(x.detail),54).slice(0,3),X+4,Y+26.5);
    doc.setFontSize(7.2);doc.setTextColor(122,14,14);doc.text(doc.splitTextToSize("Scannez pour voir l'état à jour : apte ou non, dernière et prochaine vérification",54),X+4,Y+40);
    doc.setTextColor(138,147,163);doc.setFontSize(6.8);doc.text(P(e.nom),X+4,Y+lh-3);
  });
  saveFile(`Etiquettes_QR_${e.nom.replace(/\W+/g,"_")}.pdf`,doc.output("blob"));
}

async function cropTo(url,ratio){ // recadrage centré au format du cadre
  const im=await new Promise(ok=>{const i=new Image();i.onload=()=>ok(i);i.src=url});
  let sw=im.width,sh=im.height;if(sw/sh>ratio)sw=sh*ratio;else sh=sw/ratio;
  const c=document.createElement("canvas"),k=Math.min(1,1600/sw);c.width=Math.round(sw*k);c.height=Math.round(sh*k);
  c.getContext("2d").drawImage(im,(im.width-sw)/2,(im.height-sh)/2,sw,sh,0,0,c.width,c.height);return c.toDataURL("image/jpeg",.9);
}

function hdr(doc,e,title,col,sub){
