<script>/* Lien Lakaz : lire les infos envoyées avant que la page ne nettoie l'adresse */try{const r=new URLSearchParams(location.search).get("lakaz");if(r){sessionStorage.setItem("lakaz_imp",r);const u=new URL(location.href);u.searchParams.delete("lakaz");history.replaceState(null,"",u.pathname+u.search)}}catch(e){}</script>

<script>/* Mise à jour automatique : à l'ouverture (puis toutes les 10 min), la page vérifie s'il existe une version plus récente sur le site et se recharge toute seule. */
const APP_VER="2026-11-14-rapports";
(function(){
  try{const u=new URL(location.href);if(u.searchParams.has("v")||u.searchParams.has("_")){u.searchParams.delete("v");u.searchParams.delete("_");history.replaceState(null,"",u.pathname+u.search+u.hash)}}catch(e){}
  const busy=()=>!!document.querySelector(".ov,#vg")||(()=>{try{return!!sessionStorage.getItem("lakaz_imp")}catch(e){return false}})();
  async function check(first){
    if(!/^https?:/.test(location.protocol))return;
    try{const r=await fetch(location.pathname+"?_="+Date.now(),{cache:"no-store"});if(!r.ok)return;
      const m=(await r.text()).match(/const APP_VER="([^"]+)"/);if(!m||m[1]===APP_VER)return;
      const k="reg3aim_maj_"+m[1];let n=0;try{n=Number(sessionStorage.getItem(k)||0)}catch(e){}
      if(n>=2)return; /* le site n'est pas encore à jour partout : on réessaiera plus tard */
      try{sessionStorage.setItem(k,String(n+1))}catch(e){}
      if(!busy()){location.replace(location.pathname+"?v="+encodeURIComponent(m[1])+"&_="+Date.now()+location.hash);return}
      if(!document.getElementById("majb")){const b=document.createElement("div");b.id="majb";b.setAttribute("role","status");b.style.cssText="position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:200;background:#1B5E20;color:#fff;padding:10px 14px;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.3);display:flex;gap:10px;align-items:center;font-size:14px";
        b.innerHTML='Une nouvelle version du registre est disponible.<button style="background:#fff;color:#1B5E20;border:0;border-radius:7px;padding:6px 10px;font-weight:600;cursor:pointer">Mettre à jour</button>';
        b.querySelector("button").onclick=()=>location.replace(location.pathname+"?v="+encodeURIComponent(m[1])+"&_="+Date.now()+location.hash);document.body.appendChild(b)}
    }catch(e){}}
  check(true);setInterval(()=>check(false),10*60e3);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)check(false)});
})();</script>

const DG="#2E7D32",DGD="#1B5E20";
const duList=id=>S.du.filter(d=>d.entId===id).sort((a,b)=>Number(b.version)-Number(a.version));
const duObj=d=>{if(!d._o){try{d._o=JSON.parse(d.data||"{}")}catch(x){d._o={}}d._o.units=d._o.units||[]}return d._o};
const RN=r=>Number(r.g||0)*Number(r.f||0);
const LV=v=>v>=8?"eleve":v>=4?"modere":"faible";
const LVL={faible:["Faible","#1E7F4F","#E5F3EB"],modere:["Modéré","#B26A00","#FDF1DC"],eleve:["Élevé","#B42318","#FCE8E6"]};
const MAI={bonne:"Bonne",moyenne:"Moyenne",insuffisante:"Insuffisante"};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
function newRisk(k){const r=DRK[k];const g=Number(r[5]),f=Number(r[6]),lv=LV(g*f);
  return{id:uid("k"),fam:r[1],d:r[2],s:r[3],dm:r[4],g,f,m:lv==="eleve"?"insuffisante":"moyenne",ex:r[7],ac:r[8],resp:"",dec:today(),delai:lv==="eleve"?3:lv==="modere"?6:12,fait:"",fo:r[9]}}
const echR=r=>r.dec&&r.delai?addM(r.dec,r.delai):"";
async function saveDu(d){const o=duObj(d);const row={id:d.id||"",entId:d.entId,version:d.version,metier:d.metier,date:d.date||"",redacteur:d.redacteur||"",effectif:d.effectif||"",statut:d.statut||"brouillon",data:JSON.stringify(o)};
  const r=await api("saveDuerp",{du:row});const i=S.du.findIndex(x=>x.id===r.du.id);r.du._o=o;if(i>=0)S.du[i]=r.du;else S.du.push(r.du);return r.du}
function duOpps(id){const d=duList(id)[0];if(!d)return[];const seen=new Set(),o=[];
  duObj(d).units.forEach(u=>u.risks.forEach(r=>{if(r.fo&&!r.fait&&!seen.has(r.fo)){seen.add(r.fo);o.push({t:`${r.fo} (DUERP – ${u.nom})`,qui:"Formation 3AIM CFA"})}}));return o}
function panelDuerp(e,pn){
  const L=duList(e.id),ro=S.role==="lecture";
  if(!L.length){
    pn.innerHTML=`<div class="card rubh" style="--rc:${DG}"><div><h2>Document unique (DUERP)</h2><p>Code du travail, articles L.4121-1 à L.4121-3 et R.4121-1 à R.4121-4</p></div></div>
    ${ro?`<div class="card empty">Aucun DUERP n’est encore enregistré.</div>`:`<div class="card" style="padding:18px;display:grid;gap:12px;max-width:640px">
     <h3 style="font-size:20px">Créer le DUERP de ${esc(e.nom)}</h3>
     <label class="f">Métier de l’entreprise<select id="du_m"><option value="">Choisir un métier…</option>${DM.map((m,i)=>`<option value="${i}">${esc(m[0])}</option>`).join("")}<option value="-1">Document vierge</option></select></label>
     <div class="hint" id="du_p">Les unités de travail et les risques types sont pré-remplis : il ne te reste qu’à ajuster sur le terrain.</div>
     <div class="two"><label class="f">Effectif<input id="du_e" type="number" value="${esc(e.effectif||"")}"></label><label class="f">Rédacteur (IPRP)<input id="du_r" value="Rachad MOHAMED – IPRP, 3AIM CFA"></label></div>
     <div class="err" id="du_x"></div><div><button class="btn pri" id="du_c">Créer le DUERP</button></div></div>`}`;
    if(ro)return;
    $("#du_m").onchange=()=>{const v=$("#du_m").value;$("#du_p").innerHTML=v>=0&&v!==""?"Unités pré-remplies : <b>"+DM[v][1].map(k=>esc(DU[k][0])).join(", ")+"</b>":"Les unités de travail et les risques types sont pré-remplis : il ne te reste qu’à ajuster sur le terrain."};
    $("#du_c").onclick=async()=>{const v=$("#du_m").value;if(v===""){$("#du_x").textContent="Choisis un métier ou « Document vierge ».";return}
      const units=v>=0?DM[v][1].map(k=>({id:uid("u"),nom:DU[k][0],eff:"",desc:"",risks:DU[k][1].map(newRisk)})):[];
      const d={entId:e.id,version:1,metier:v>=0?DM[v][0]:"",date:"",redacteur:$("#du_r").value.trim(),effectif:$("#du_e").value,statut:"brouillon",_o:{units}};
      $("#du_c").disabled=true;$("#du_c").textContent="Création…";
      try{await saveDu(d);V.duv=null;V.duu=0;toast("DUERP créé");renderEnt()}catch(z){$("#du_x").textContent=z.message;$("#du_c").disabled=false;$("#du_c").textContent="Créer le DUERP"}};
    return;
  }
  const d=L.find(x=>x.id===V.duv)||L[0];if(V.dutour)return panelTournee(e,d,pn);
  const o=duObj(d),U=o.units,ui=Math.min(V.duu||0,Math.max(0,U.length-1)),u=U[ui];
  const all=U.flatMap(x=>x.risks),el=all.filter(r=>LV(RN(r))==="eleve").length,late=all.filter(r=>!r.fait&&echR(r)&&jours(echR(r))<0).length,done=all.filter(r=>r.fait).length;
  const nxt=d.date?addM(d.date,12):"";
  pn.innerHTML=`<div class="card rubh" style="--rc:${DG}"><div><h2>Document unique – version ${esc(d.version)}</h2><p>${esc(d.metier||"Document vierge")} · ${d.statut==="validé"?`validé le ${fr(d.date)} · prochaine mise à jour avant le <b>${fr(nxt)}</b>`:"brouillon, non encore validé"}</p></div><div class="sp"></div>
   ${L.length>1?`<select id="du_v" style="border:1px solid var(--line);border-radius:7px;padding:7px">${L.map(x=>`<option value="${x.id}" ${x.id===d.id?"selected":""}>Version ${esc(x.version)}${x.statut==="validé"?" – "+fr(x.date):" – brouillon"}</option>`).join("")}</select>`:""}
   <button class="btn" id="du_tr">La tournée photo${PH[d.id]?" · "+PH[d.id].length:""}</button><button class="btn pri" id="du_pdf">PDF du DUERP</button>${ro?"":`${d.statut!=="validé"?`<button class="btn" id="du_val">Valider</button>`:""}<button class="btn" id="du_nv">Nouvelle version</button><button class="btn ghost" id="du_inf">Infos</button>`}</div>
  <div class="grid kpis" style="margin:0 0 14px">
   <div class="card kpi" style="--c:${DG}"><div class="n">${U.length}</div><div class="l">Unités de travail</div></div>
   <div class="card kpi" style="--c:#B42318"><div class="n" style="color:var(--bad)">${el}</div><div class="l">Risques élevés</div></div>
   <div class="card kpi" style="--c:#C17D00"><div class="n" style="color:var(--warn)">${late}</div><div class="l">Actions en retard</div></div>
   <div class="card kpi" style="--c:#1E7F4F"><div class="n" style="color:var(--ok)">${done} / ${all.length}</div><div class="l">Actions réalisées</div></div></div>
  <div class="quick" style="--rc:${DG}">${U.map((x,i)=>{const m=Math.max(0,...x.risks.map(RN)),c=LVL[LV(m)];return `<button class="chip" data-u="${i}" style="${i===ui?`border-style:solid;border-color:${DG};color:var(--ink);font-weight:600`:""}"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${x.risks.length?c[1]:"#bbb"};margin-right:6px"></span>${esc(x.nom)} · ${x.risks.length}</button>`}).join("")}${ro?"":`<button class="chip" id="du_au">+ Unité de travail</button>`}</div>
  ${u?`<div class="card" style="padding:12px 14px;margin-bottom:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-left:5px solid ${DG};border-radius:0 10px 10px 0"><div style="flex:1;min-width:200px"><b style="font-size:17px">${esc(u.nom)}</b><div class="hint">${esc([u.eff?u.eff+" salarié(s)":"",u.desc].filter(Boolean).join(" · "))}</div></div>
    ${ro?"":`<select id="du_ar" style="border:1px solid var(--line);border-radius:7px;padding:7px;max-width:260px"><option value="">+ Ajouter un risque…</option><option value="__">Risque libre</option>${[...new Set(DR.map(r=>r[1]))].map(f=>`<optgroup label="${esc(f)}">${DR.filter(r=>r[1]===f).map(r=>`<option value="${r[0]}">${esc(r[2])}</option>`).join("")}</optgroup>`).join("")}</select><button class="btn sm ghost" id="du_eu">Modifier l’unité</button>`}</div>
  <div id="du_ph"></div><div class="rows">${u.risks.slice().sort((a,b)=>RN(b)-RN(a)).map(r=>{const v=RN(r),c=LVL[LV(v)],ec=echR(r),lt=!r.fait&&ec&&jours(ec)<0;return `<div class="card row du" style="--sc:${c[1]}">

function modal(title,color,body,actions){
  const ov=document.createElement("div");ov.className="ov";
  ov.innerHTML=`<div class="modal" role="dialog" aria-modal="true" style="--rc:${color}"><header><h2>${title}</h2><button class="btn ghost sm" data-x aria-label="Fermer">✕</button></header><div class="bd">${body}</div><footer>${actions}</footer></div>`;
  document.body.appendChild(ov);
  const close=()=>{ov.remove();document.removeEventListener("keydown",k)};const k=ev=>{if(ev.key==="Escape")close()};
  document.addEventListener("keydown",k);ov.querySelector("[data-x]").onclick=close;ov.onclick=ev=>{if(ev.target===ov)close()};
  setTimeout(()=>ov.querySelector("input,select,textarea")?.focus(),30);
  return{ov,close,q:s=>ov.querySelector(s)};
}

async function saveFile(name,blob){
  try{if(window.claude&&window.claude.use){const dl=await window.claude.use("downloads");if(dl){await dl.save({filename:name,data:blob});return}}}catch(x){if(x&&x.code==="declined")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
const dataBlob=u=>{const [h,b]=u.split(","),bin=atob(b),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:h.slice(5).split(";")[0]})};

const toB64=f=>new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]);r.onerror=ko;r.readAsDataURL(f)});
async function uploadFile(e,f,kind){if(f.size>15e6)throw new Error("Fichier trop lourd (15 Mo maximum)");return api("upload",{entId:e.id,kind,name:f.name,mime:f.type||"application/octet-stream",data:await toB64(f)})}
async function uploadPhoto(e,f){
  if(!f)return;if(!f.type.startsWith("image/")){toast("Choisis une image");return}
  const img=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=URL.createObjectURL(f)});
  const k=Math.min(1,1400/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  const url=c.toDataURL("image/jpeg",.85);toast("Envoi de la photo…");
  try{await api("upload",{entId:e.id,kind:"photo",name:"photo_"+e.nom+".jpg",mime:"image/jpeg",data:url.split(",")[1]});S.photos[e.id]=url;e.photoId=e.photoId||"ok";renderEnt();toast("Photo enregistrée")}catch(z){toast(z.message)}
}

async function etiquettes(e){await need("jspdf","qr");

    doc.setDrawColor(200,205,214);doc.setLineWidth(.3);doc.roundedRect(X,Y,lw,lh,2.5,2.5);
    for(let j=0;j<40;j++){const t=j/39;doc.setFillColor(Math.round(94+(211-94)*t),Math.round(10+(47-10)*t),Math.round(10+(47-10)*t));doc.rect(X+lw*j/40,Y,lw/40+.2,9,"F")}

    doc.setTextColor(20,33,61);doc.setFont("helvetica","bold");doc.setFontSize(10);doc.text(doc.splitTextToSize(P(x.libelle),54).slice(0,2),X+4,Y+16);
    doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(75,85,99);doc.text(doc.splitTextToSize(P(x.detail),54).slice(0,3),X+4,Y+26.5);
    doc.setFontSize(7.2);doc.setTextColor(122,14,14);doc.text(doc.splitTextToSize("Scannez pour voir l'état à jour : apte ou non, dernière et prochaine vérification",54),X+4,Y+40);
    doc.setTextColor(138,147,163);doc.setFontSize(6.8);doc.text(P(e.nom),X+4,Y+lh-3);

async function cropTo(url,ratio){ // recadrage centré au format du cadre
  url=String(url||"");if(url&&!/^(data:|blob:|https?:)/.test(url))url="data:image/jpeg;base64,"+url;
  const im=await new Promise((ok,ko)=>{const i=new Image(),t=setTimeout(()=>ko(new Error("photo illisible")),10000);i.onload=()=>{clearTimeout(t);ok(i)};i.onerror=()=>{clearTimeout(t);ko(new Error("photo illisible"))};i.src=url});
  if(!im.width||!im.height)throw new Error("photo illisible");
  let sw=im.width,sh=im.height;if(sw/sh>ratio)sw=sh*ratio;else sh=sw/ratio;
  const c=document.createElement("canvas"),k=Math.min(1,1600/sw);c.width=Math.round(sw*k);c.height=Math.round(sh*k);
  c.getContext("2d").drawImage(im,(im.width-sw)/2,(im.height-sh)/2,sw,sh,0,0,c.width,c.height);return c.toDataURL("image/jpeg",.9);
}

/* brouillons gardés sur l'appareil (IndexedDB, avec les photos) */
const vgDB = (() => { let p; const open = () => p || (p = new Promise((ok, ko) => { const r = indexedDB.open("reg3aim_vgp", 1); r.onupgradeneeded = () => r.result.createObjectStore("d"); r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); }));
  const tx = (m, f) => open().then(db => new Promise((ok, ko) => { const t = db.transaction("d", m), q = f(t.objectStore("d")); t.oncomplete = () => ok(q && q.result); t.onerror = () => ko(t.error); }));
  return { get: k => tx("readonly", s => s.get(k)).catch(() => null), set: (k, v) => tx("readwrite", s => s.put(v, k)).catch(() => null), del: k => tx("readwrite", s => s.delete(k)).catch(() => null) }; })();

const vgT = () => VG_T[VG.type] || VG_T.pelle;
const vgK = (si, pi) => "s" + si + "p" + pi;
function vgP(k) { return VG.pts[k] = VG.pts[k] || { r: "", obs: "", ano: true, lib: "", act: "", delai: "Sous 1 mois" }; }
function vgSave() { clearTimeout(vgSaveH); vgSaveH = setTimeout(() => vgDB.set("e_" + VGE.id, VG), 400); }
function vgGet(k) { return k.split(".").reduce((o, x) => o == null ? "" : o[x], VG) ?? ""; }
function vgSet(k, v) { const a = k.split("."), l = a.pop(); a.reduce((o, x) => o[x] = o[x] || {}, VG)[l] = v; }
function vgTypeFrom(x) { const t = (x.libelle + " " + x.detail).toLowerCase();
  return /chariot/.test(t) ? "chariot" : /nacelle|pemp/.test(t) ? (/porteur|immat|camion|iveco/.test(t) ? "nacellePorteur" : "nacelleAuto") : /multibenne|ampliroll|crochet/.test(t) ? "bras" : /grue|bras de levage/.test(t) ? "grue" : "pelle"; }
function vgVide(e) {
  return { v: 1, ent: { nom: e.nom || "", adr: [e.adresse, [e.cp, e.ville].filter(Boolean).join(" ")].filter(Boolean).join(", "), siren: "", siret: e.siret || "", dir: e.contact || "" },
    elId: "", date: today(), verif: "MOHAMED Cassim", type: "pelle", id: { desig: VG_T.pelle.desig, equip: "" }, nl: {}, idph: {}, idlab: {},

/* ---------- ouverture ---------- */
async function openVGP(e, elId) {
  VGE = e;
  const d = await vgDB.get("e_" + e.id);
  if (d && (!elId || d.elId === elId) && (Object.keys(d.pts || {}).length || d.id.marque)) {
    const m = modal("VGP en cours", "#E87722", `<p style="margin:0">Une VGP commencée pour <b>${esc(e.nom)}</b> est gardée sur cet appareil${d.id.marque ? " (" + esc(d.id.marque + " " + (d.id.modele || "")) + ")" : ""}. Tu la reprends ?</p>`,
      `<button class="btn" id="vgn">Nouvelle VGP</button><button class="btn pri" id="vgr">Reprendre</button>`);
    m.q("#vgr").onclick = () => { m.close(); VG = d; vgOpen(); };
    m.q("#vgn").onclick = () => { m.close(); vgNew(e, elId); };
    return;
  }
  vgNew(e, elId);
}
async function vgNew(e, elId) {
  VG = vgVide(e);
  if (elId) await vgPickEl(elId, true); else vgOpen();
}
async function vgPickEl(elId, open) {
  VG.elId = elId || "";
  const x = S.els.find(y => y.id === elId);
  if (x) {
    VG.type = vgTypeFrom(x); VG.id.desig = vgT().desig; VG.nl = {}; VG.pts = {};
    try { const r = await api("lastVGP", { entId: VGE.id, elId }); const o = r.vgp && r.vgp.data ? JSON.parse(r.vgp.data) : null;
      if (o) { VG.type = o.type; VG.id = Object.assign({}, o.id); VG.nl = Object.assign({}, o.nl); VG.idlab = o.idlab || {}; VG.ent = Object.assign(VG.ent, { siren: o.ent.siren || VG.ent.siren, dir: o.ent.dir || VG.ent.dir });
        toast("Fiche de l’engin reprise de la " + r.vgp.num); }
    } catch (z) {}
  }
  if (open) vgOpen(); else { vgSave(); vgBoot(); }
}

function vgGo(i) {

(function(){
  const dig=x=>String(x||"").replace(/\D/g,""),nrm=x=>String(x||"").toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Z0-9]/g,"");
  let LK=null,tries=0;
  function decode(r){const b=atob(String(r).replace(/-/g,"+").replace(/_/g,"/"));return JSON.parse(decodeURIComponent(escape(b)))}
  function run(){const r=(()=>{try{return sessionStorage.getItem("lakaz_imp")}catch(e){return null}})();if(!r)return true;
    if(!S.role)return false;
    try{sessionStorage.removeItem("lakaz_imp")}catch(e){}
    if(S.role!=="admin"){toast("Pour préparer un DUERP depuis Lakaz, connecte-toi avec le code administrateur.");return true}
    let d;try{d=decode(r)}catch(e){toast("Lien Lakaz illisible : réessaie depuis Lakaz.");return true}
    const ex=(dig(d.siret).length>=9&&S.ents.find(e=>dig(e.siret).slice(0,9)===dig(d.siret).slice(0,9)))||S.ents.find(e=>nrm(e.nom)&&nrm(e.nom)===nrm(d.nom));
    const base=ex?{...ex}:{relances:"oui",verificateur:"RUNIXO CONTRÔLE"};
    ["nom","forme","siret","adresse","cp","ville","activite","effectif","contact","email","tel"].forEach(k=>{if(d[k]&&!String(base[k]||"").trim())base[k]=d[k]});
    LK={metier:d.metier||"",naf:nafNorm(d.naf)||nafOf(d.activite),activite:d.activite||"",effectif:d.effectif||""};

    return true}

    if(action==="saveEnt"&&res&&res.ent&&res.ent.id&&ABO_FORM.pending){const a=ABO_FORM.pending;ABO_FORM.pending=null;metaSet(res.ent.id,a)}
    if(action==="saveEnt"&&res&&res.ent&&res.ent.id&&NAF_FORM.pending!==null){const n=NAF_FORM.pending;NAF_FORM.pending=null;if(n)nafSetEnt(res.ent.id,n);else if(NAFS.ent[res.ent.id]){delete NAFS.ent[res.ent.id];nafSaveLocal()}if(LK&&n)LK.naf=n}
    let L0=null;
    if(action==="saveEnt"&&res&&res.ent&&res.ent.id){if(LK){L0=LK;LK=null}else if(isNew&&S.role==="admin")L0={metier:"",naf:NAFS.ent[res.ent.id]||"",activite:res.ent.activite||"",effectif:res.ent.effectif||""}}

        if(duList(id).length){V={view:"ent",ent:id,tab:"duerp"};V.duv=null;V.duu=0;render();toast("Cette entreprise a déjà un DUERP : il est ouvert.");return}
        const det=nafDetect(L.naf,L.metier,L.activite||e.activite);
        V={view:"ent",ent:id,tab:"duerp"};render();toast("Création du DUERP version 1…");
        try{await duAuto(e,det,L.effectif);V.duv=null;V.duu=0;renderEnt();
          toast(det.m?"DUERP v1 créé – type : "+det.m:"DUERP v1 créé avec un socle général : choisis le type")}
        catch(z){toast("Création du DUERP impossible : "+z.message);renderEnt()}},200)}
    return res};
  const t=setInterval(()=>{tries++;if(run()||tries>80)clearInterval(t)},400);
  const t2=setInterval(()=>{if(S.role!=="admin"||DEMO){if(DEMO)clearInterval(t2);return}clearInterval(t2);
    api("nafMaps").then(r=>{if(r&&r.map){NAFS.map=Object.assign({},r.map,NAFS.map);NAFS.ent=Object.assign({},r.ent||{},NAFS.ent);if(r.meta)NAFS.meta=Object.assign({},NAFS.meta,r.meta);NAFS.srv=true;nafSaveLocal();if(V.view==="dash")render()}}).catch(()=>{})},1500);
})();

const TPS={k:"reg3aim_temps",d:null,last:Date.now(),tick:Date.now(),dirty:0};

["mousemove","keydown","click","scroll","touchstart","wheel"].forEach(ev=>addEventListener(ev,()=>{TPS.last=Date.now()},{passive:true,capture:true}));
const tpsFmt=s=>{s=Math.round(s/60);return s<60?s+" min":Math.floor(s/60)+" h "+String(s%60).padStart(2,"0")};
const tpsEnt=()=>V.view==="ent"?V.ent:V.view==="machine"?(S.els.find(x=>x.id===V.el)||{}).entId:null;
const tpsActif=()=>S.role==="admin"&&Date.now()-TPS.last<30*60e3;
function tpsSave(){const j=TPS.d.j,K=Object.keys(j).sort();K.slice(0,Math.max(0,K.length-400)).forEach(k=>delete j[k]);store.set(TPS.k,JSON.stringify(TPS.d));TPS.dirty=0}
setInterval(()=>{const now=Date.now(),dt=Math.min(now-TPS.tick,15000)/1000;TPS.tick=now;
  if(tpsActif()){const j=TPS.d.j[today()]=TPS.d.j[today()]||{t:0,e:{}};j.t+=dt;const id=tpsEnt();if(id)j.e[id]=(j.e[id]||0)+dt;if(++TPS.dirty>=6)tpsSave()}
  tpsPaint()},5000);
addEventListener("pagehide",()=>{if(TPS.dirty)tpsSave()});
function tpsPaint(){if(S.role!=="admin")return;const top=document.querySelector(".top .in");if(!top)return;let b=document.getElementById("tmr");
  if(!b){b=document.createElement("button");b.id="tmr";b.className="btn dk sm";b.title="Temps passé dans le registre (pause après 30 min sans activité) – clic pour le détail";b.onclick=tpsDetail;const w=top.querySelector(".who");w?top.insertBefore(b,w):top.appendChild(b)}
  const j=TPS.d.j[today()]||{t:0,e:{}},id=tpsEnt(),e=id&&S.ents.find(x=>x.id===id),a=tpsActif();
  b.textContent=(a?"⏱ ":"⏸ en pause · ")+"aujourd’hui "+tpsFmt(j.t)+(e?" · "+e.nom+" "+tpsFmt(j.e[id]||0):"");b.style.opacity=a?"1":".75"}
function tpsDetail(){const per={jour:"Aujourd’hui",sem:"Cette semaine",mois:"Ce mois-ci"};let cur="jour";
  const keys=p=>{const t=today(),d=new Date(t+"T00:00:00");if(p==="jour")return[t];

  const m=modal("⏱ Temps passé dans le registre","#12213F",`<div class="quick" id="tp_p" style="margin:0 0 10px"></div><div id="tp_b"></div><p class="hint" style="margin:10px 0 0">Compté sur cet ordinateur uniquement, avec une pause automatique après 30 minutes sans activité.</p>`,`<button class="btn" data-x2>Fermer</button>`);

    const K=keys(cur),tot={},T=K.reduce((a,k)=>{const j=TPS.d.j[k];Object.entries(j.e||{}).forEach(([i,s])=>tot[i]=(tot[i]||0)+s);return a+(j.t||0)},0);

    await need("jspdf","h2c");let off=document.getElementById("vgoff");if(!off){off=document.createElement("div");off.id="vgoff";document.body.appendChild(off)}

      const tous=autres.concat(K.map(k=>{k._num=EP.saved.nums[0];return k})).sort((a,b)=>parseInt(a._num)-parseInt(b._num));
      EP.kits=tous;try{doc=await pdfDe({recapOnly:true,nums:tous.map(k=>k._num)},"Récapitulatif mis à jour")}finally{EP.kits=sauve}
      blob=doc.output("blob");st("Classement du récapitulatif mis à jour…");r2=await api("epiPdf",{entId:EPE.id,kind:"recap",pids:EP.rev.autres.map(x=>x.id).concat(EP.saved.pids),date:EP.date,name:`Recapitulatif_EPI_${EP.date}_maj_${today()}_${base}.pdf`,data:doc.output("datauristring").split(",")[1]})}
    else{doc=await pdfDe({},"PDF récapitulatif");blob=doc.output("blob");
      st("Classement du récapitulatif dans le Drive du client…");r2=await api("epiPdf",{entId:EPE.id,kind:"recap",pids:EP.saved.pids,date:EP.date,name:"Recapitulatif_"+name,data:doc.output("datauristring").split(",")[1]})}

<script>
/* ============ ENREGISTREMENT INSTANTANÉ + SUPPRESSION GROUPÉE ============
   Les modifications et suppressions s'affichent tout de suite ; l'envoi au moteur se fait en arrière-plan,
   dans l'ordre, avec un indicateur en haut de l'écran. En cas d'échec, un message prévient et le registre se recharge. */
(function(){
  const DELS=new Set(["delEl","delRes","delFiche","delDuerp","delPhoto"]);
  const UPD={saveEl:["el","els"],saveRes:["res","res"],saveFiche:["fic","fic"],saveDuerp:["du","du"]};
  let Q=Promise.resolve(),N=0,ERR=0,tFin=null;
  function ind(){let b=document.getElementById("syncq");if(!b){b=document.createElement("div");b.id="syncq";b.setAttribute("role","status");b.setAttribute("aria-live","polite");
      b.style.cssText="position:fixed;top:calc(70px + env(safe-area-inset-top,0px));right:16px;z-index:70;padding:7px 12px;border-radius:20px;font-size:13.5px;font-weight:600;box-shadow:0 3px 12px rgba(0,0,0,.2);transition:opacity .4s";document.body.appendChild(b)}
    clearTimeout(tFin);
    if(N>0){b.style.opacity="1";b.style.background="#12213F";b.style.color="#fff";b.textContent="⏳ Enregistrement…"+(N>1?" ("+N+")":"")}
    else{b.style.background=ERR?"#B42318":"#1E7F4F";b.style.color="#fff";b.textContent=ERR?"⚠️ Non enregistré":"✓ Enregistré";tFin=setTimeout(()=>{b.style.opacity="0"},1800);ERR=0}}
  function echec(z,action){ERR=1;const m=modal("Une modification n’a pas été enregistrée","#B42318",`<p style="margin:0">Le moteur a répondu : <b>${esc(z&&z.message||String(z))}</b></p><p class="hint" style="margin:0">Vérifie ta connexion. Le registre va se recharger pour afficher l’état réellement enregistré ; refais ensuite la modification.</p>`,`<button class="btn pri" id="sq_r">Recharger le registre</button>`);
    m.q("#sq_r").onclick=async()=>{m.close();try{await reload();render()}catch(x){toast(x.message)}}}
  addEventListener("beforeunload",ev=>{if(N>0){ev.preventDefault();ev.returnValue=""}});
  const _api=api;
  api=function(action,p){
    const u=UPD[action],isDel=DELS.has(action),isUpd=u&&p&&p[u[0]]&&p[u[0]].id;
    if(DEMO||!(isDel||isUpd))return _api(action,p);
    N++;ind();
    const job=Q.then(()=>_api(action,p)).then(r=>{
      if(isUpd&&r&&r[u[0]]){const arr=S[u[1]],o=r[u[0]],i=arr.findIndex(x=>x.id===o.id);
        if(i>=0){const keep=arr[i]._o;arr[i]=o;if(keep&&action==="saveDuerp")arr[i]._o=keep}
        if(!document.querySelector(".ov")&&!document.getElementById("vg")&&!document.getElementById("ep")&&V.view==="ent")try{renderEnt()}catch(z){}}
      return r}).catch(z=>{echec(z,action)}).finally(()=>{N--;ind()});
    Q=job.catch(()=>{});
    if(isUpd){const o=JSON.parse(JSON.stringify(p[u[0]]));if(action==="saveEl"&&o.dernier&&o.per)o.prochain=addM(o.dernier,o.per);return Promise.resolve({[u[0]]:o})}
    return Promise.resolve({})};
  const _reload=reload;reload=async function(){await Q;return _reload.apply(this,arguments)};
  window.syncAttente=()=>Q;
})();

/* ---------- suppression groupée dans les listes ---------- */
let SELM=false;
const _renderEntSel=renderEnt;
renderEnt=function(){_renderEntSel.apply(this,arguments);try{selPrepare()}catch(z){console.warn(z)}};
function selPrepare(){const pn=document.getElementById("pn");document.getElementById("selbar")?.remove();if(!pn||S.role==="lecture")return;
  const T=V.tab,isObs=T==="obs",rows=[...pn.querySelectorAll(".card")].map(c=>{const m=c.querySelector("[data-m]"),f=c.querySelector("[data-fm]");
    if(f)return{c,id:f.dataset.fm,k:"fic"};if(m&&(isObs||RUB[T]))return{c,id:m.dataset.m,k:isObs?"res":"els"};return null}).filter(Boolean);
  if(rows.length<2){SELM=false;return}
  const h=pn.querySelector(".rubh .sp");if(h&&!pn.querySelector("#selon"))h.insertAdjacentHTML("afterend",`<button class="btn ${SELM?"pri":""}" id="selon" style="margin-right:6px">${SELM?"✓ Sélection":"☑ Sélectionner"}</button>`);
  pn.querySelector("#selon").onclick=()=>{SELM=!SELM;renderEnt()};

    <label style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" id="ac_ok"> <span>Bon pour accord : j’accepte ce devis et ses conditions.</span></label>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><label class="f" style="flex:1;min-width:180px">Nom et prénom<input id="ac_n"></label><label class="f" style="flex:1;min-width:160px">Fonction<input id="ac_f"></label></div>
    <div><span class="hint">Signature (souris ou doigt)</span><canvas id="ac_c" style="width:100%;height:150px;border:2px dashed var(--line);border-radius:8px;background:#fff;touch-action:none;display:block"></canvas><button class="btn sm ghost" id="ac_eff">Effacer</button></div><div class="err" id="ac_x"></div>`,
    `<button class="btn danger ghost" id="ac_no" style="margin-right:auto">Refuser le devis</button><button class="btn" data-x2>Plus tard</button><button class="btn pri" id="ac_go">✅ Accepter et signer</button>`);

  c.onpointermove=ev=>{if(!down)return;const p=pt(ev),x=c.getContext("2d");x.beginPath();x.moveTo(...last);x.lineTo(...p);x.stroke();last=p;drawn=true};c.onpointerup=c.onpointercancel=()=>{down=false};m.q("#ac_eff").onclick=fit;

    const k=Math.min(1,420/c.width),t2=document.createElement("canvas");t2.width=Math.round(c.width*k);t2.height=Math.round(c.height*k);const g=t2.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,t2.width,t2.height);g.drawImage(c,0,0,t2.width,t2.height);

  m=t.replace(/\s/g,"").match(/^-?[\d.]+,\d{2}€/);if(m)return[1,Number(m[0].replace(/[.€]/g,"").replace(",","."))];
  m=t.match(/^(-?\d+(?:[.,]\d+)?)\s*%?/);if(m)return[1,Number(m[1].replace(",","."))];return[2,t.toLowerCase()]}

function drvPlan(c,entId){let nv=0,maj=0,ok=0,docs=0;
  c.els.forEach(it=>{const x=entId?drvEl(entId,it):null;if(!x)nv++;else if(String(x.dernier||"")<String(it.dt||""))maj++;else ok++;
    if(it.doc&&!drvHas(it.doc))docs++;(it.h||[]).forEach(h=>{if(!drvHas(h[1]))docs++})});

function driveImport(){

    if(d&&!confirm(`⚠️ Doublon : ${p.fic.type==="devis"?"le devis":"la facture"} n° ${p.fic.a} existe déjà (${rxNom(d.entId)}, ${fr(d.date)}).\n\nEnregistrer quand même ?`))throw new Error("Enregistrement annulé : ce numéro existe déjà. Change le numéro ou ouvre le document existant.")}

function rxDoublons(type){const L=rxDocs(type),out=[],vu={};
  L.forEach(f=>{const k=String(f.a);(vu[k]=vu[k]||[]).push(f)});Object.values(vu).filter(g=>g.length>1).forEach(g=>out.push({t:`N° ${g[0].a} utilisé ${g.length} fois`,ids:g.map(f=>f.id)}));
  if(type==="fact"){const sig=f=>{const o=rxO(f),dts=[...new Set((o.l||[]).map(x=>(String(x.lib).match(/\d{2}\/\d{2}\/\d{4}/g)||[])).flat())].sort().join(","),q=(o.l||[]).reduce((a,x)=>a+(Number(x.q)>0?Number(x.q):0),0);return dts?f.entId+"|"+dts+"|"+q:""};
    const g={};L.filter(f=>f.b!=="annulee"&&!rxO(f).avoir&&!rxO(f).annule).forEach(f=>{const s=sig(f);if(s)(g[s]=g[s]||[]).push(f)});Object.values(g).filter(x=>x.length>1).forEach(x=>out.push({t:`Même contrôle facturé ${x.length} fois : n° ${x.map(f=>f.a).join(" et ")} (${rxNom(x[0].entId)})`,ids:x.map(f=>f.id)}))}

<script>

/* --- Devis → facture --- */
const _devisFormAv=devisForm;
devisForm=function(src){_devisFormAv.apply(this,arguments);try{const ex=src&&src.id?S.fic.find(x=>x.id===src.id):null;if(!ex||S.role!=="admin")return;const ov=[...document.querySelectorAll(".ov")].pop();if(!ov)return;

    const o=rxO(ex);try{if(ex.b!=="accepte"){const r=await api("saveFiche",{fic:{...ex,b:"accepte"}});const i=S.fic.findIndex(x=>x.id===r.fic.id);if(i>=0)S.fic[i]=r.fic}}catch(z){toast(z.message);return}

    if(F.length&&reste>0.009){const f2=[...document.querySelectorAll(".ov")].pop();f2&&f2.querySelector(".bd").insertAdjacentHTML("afterbegin",`<div class="hint" style="color:#9A3412">Facture complémentaire : reste à facturer sur ce devis ${eur(reste)} HT. Ajuste les quantités avant d’enregistrer.</div>`)}}}catch(z){console.warn(z)}};

/* --- Facture → avoir --- */
function rxAvoirForm(f){const o=rxO(f),e=S.ents.find(x=>x.id===f.entId)||{},deja=rxAvoirsDe(f),dejaHT=-deja.reduce((a,x)=>a+rxHT(x),0);
  const L=(o.l||[]).filter(x=>Number(x.pu)>0).map(x=>({...x,c:Number(x.q)||0}));
  const m=modal(`↩️ Avoir sur la facture ${esc(f.a)}`,"#6B21A8",`
   <div class="hint">${esc(e.nom||"")} · facture du ${fr(f.date)} · ${eur(rxTot(o.l,o.tva).ttc)} TTC${deja.length?` · <span style="color:var(--bad)">avoir(s) déjà fait(s) : ${deja.map(a=>esc(a.a)).join(", ")} (${eur(dejaHT)} HT)</span>`:""}</div>
   <div style="display:flex;gap:16px;margin:8px 0"><label><input type="radio" name="av_t" value="tot" checked> Avoir total (annule la facture)</label><label><input type="radio" name="av_t" value="par"> Avoir partiel</label></div>

   <label class="f" style="width:200px">N° de l’avoir<input id="av_n" value="${rxNumAvoir()}"></label><div class="err" id="av_x"></div>`,
   `<button class="btn" data-x2>Annuler</button><button class="btn pri" id="av_go" style="background:#6B21A8;border-color:#6B21A8">↩️ Créer l’avoir</button>`);

      if(!par){const of=rxO(f);of.avoirs=(of.avoirs||[]).concat(r.fic.id);of.annule=r.fic.id;const r2=await api("saveFiche",{fic:{...f,e:JSON.stringify(of)}});const i=S.fic.findIndex(x=>x.id===r2.fic.id);if(i>=0)S.fic[i]=r2.fic}
      setTimeout(saveCache,0);m.close();document.querySelectorAll(".ov").forEach(x=>x.remove());toast(`Avoir ${num} créé${par?"":" – facture "+f.a+" annulée"}`);render()}

  await need("autotable");const {jsPDF}=window.jspdf,doc=new jsPDF({unit:"mm",format:"a4"}),o=rxO(f),e=S.ents.find(x=>x.id===f.entId)||{},t=rxTot(o.l,o.tva),W=210,NAV=[18,33,63],PU=[107,33,168],orig=S.fic.find(x=>x.id===o.avoir);

  doc.setFont("helvetica","normal");doc.setFontSize(8.5);doc.text("Vérifications périodiques – VGP, EPI antichute – Prévention (DUERP, registre de sécurité)",14,20);doc.text(`${RX_ORG.adr} · ${RX_ORG.tel} · ${RX_ORG.mail}`,14,25);
  doc.setFont("helvetica","bold");doc.setFontSize(15);doc.text("AVOIR",W-14,13,{align:"right"});doc.setFontSize(11);doc.text("N° "+f.a,W-14,20,{align:"right"});doc.setFont("helvetica","normal");doc.setFontSize(9);doc.text("Date : "+fr(f.date),W-14,25,{align:"right"});
  doc.setTextColor(20,33,61);doc.setFontSize(9);doc.setFont("helvetica","bold");doc.text("Client",120,42);doc.setFont("helvetica","normal");
  const cl=[e.nom,e.adresse,[e.cp,e.ville].filter(Boolean).join(" "),e.siret?"SIRET "+e.siret:""].filter(Boolean);doc.setDrawColor(220);doc.roundedRect(116,37,80,8+cl.length*5,2,2);cl.forEach((l,i)=>doc.text(String(l),120,48+i*5));
  doc.setFont("helvetica","bold");doc.setFontSize(10.5);doc.text(doc.splitTextToSize(orig?`Avoir sur la facture n° ${orig.a} du ${fr(orig.date)}`:(o.objet||"Avoir"),95),14,48);
  if(o.note){doc.setFont("helvetica","normal");doc.setFontSize(9);doc.text(doc.splitTextToSize("Motif : "+o.note,95),14,56)}
  doc.autoTable({startY:Math.max(66,50+cl.length*5),head:[["Désignation","Qté","PU HT","Total HT"]],body:o.l.map(x=>[x.lib,String(x.q),eur(x.pu),eur((Number(x.q)||0)*(Number(x.pu)||0))]),theme:"grid",styles:{fontSize:9,cellPadding:2.2,textColor:[20,33,61]},headStyles:{fillColor:PU,textColor:255},columnStyles:{1:{halign:"center",cellWidth:16},2:{halign:"right",cellWidth:26},3:{halign:"right",cellWidth:28}},margin:{left:14,right:14}});
  let y=doc.lastAutoTable.finalY+6;doc.setFontSize(10);[["Total HT",eur(t.ht)],[`TVA ${o.tva} %`,eur(t.tv)],["Total avoir TTC",eur(t.ttc)]].forEach(([a,b],i)=>{doc.setFont("helvetica",i===2?"bold":"normal");doc.text(a,150,y+i*6,{align:"right"});doc.text(b,W-14,y+i*6,{align:"right"})});
  y+=26;doc.setFont("helvetica","normal");doc.setFontSize(9);doc.text(doc.splitTextToSize("Montant à déduire de la facture d’origine ou à rembourser au client.",W-28),14,y);
  doc.setFontSize(7.5);doc.setTextColor(120);doc.text(`${RX_ORG.nom} – ${RX_ORG.forme} – ${RX_ORG.adr} – ${RX_ORG.rcs} – TVA FR68 988 171 740`,W/2,290,{align:"center"});
  const name=rxCourt(`Avoir_${f.a}_${e.nom||""}`,56)+".pdf";return{blob:doc.output("blob"),b64:doc.output("datauristring").split(",")[1],name}};
const _rxNomFichierAv=rxNomFichier;rxNomFichier=function(f){return rxEstAvoir(f)?rxCourt(`Avoir_${f.a}_${(S.ents.find(x=>x.id===f.entId)||{}).nom||""}`,56)+".pdf":_rxNomFichierAv.apply(this,arguments)};

/* --- Liste des factures : avoirs en violet/rouge + filtre « Avoirs » --- */

  const lit=k=>{try{return localStorage.getItem(k)==="1"}catch(z){return false}},ecrit=(k,v)=>{try{localStorage.setItem(k,v?"1":"0")}catch(z){}};

  const ttcDe=x=>rxTot(rxO(x).l,rxO(x).tva).ttc,typeDe=x=>x.type==="devis"?"Devis":rxO(x).avoir?"Avoir":"Facture",icDe=x=>x.type==="devis"?"📝":rxO(x).avoir?"↩️":"💶";

  /* devis et factures dans les résultats de recherche */

{const _le3=lignesEditeur;lignesEditeur=function(box,o){box.__o=o;return _le3.apply(this,arguments)}}

    <label class="f">Noms des salariés (facultatif, un par ligne)<textarea id="es_t" rows="7" placeholder="DUPONT Jean&#10;MARTIN Paul">${esc((o.ensNoms||[]).join("\n"))}</textarea></label><div class="err" id="es_x"></div>`,
   `<button class="btn" data-x2>Annuler</button><button class="btn pri" id="es_ok">Ajouter au devis</button>`);

  m.q("#es_t").oninput=()=>{const n=rxNomsTxt(m.q("#es_t").value).length;if(n>(Number(m.q("#es_n").value)||0))m.q("#es_n").value=n};
  m.q("#es_ok").onclick=()=>{const noms=rxNomsTxt(m.q("#es_t").value),n=Math.max(Number(m.q("#es_n").value)||0,noms.length),lib=m.q("#es_l").value.trim();
    if(!n){m.q("#es_x").textContent="Indique le nombre de salariés ou leurs noms.";return}if(!lib){m.q("#es_x").textContent="Indique le libellé.";return}
    const pu=Number(m.q("#es_p").value)||0;if(ligne){ligne.lib=lib;ligne.q=n;ligne.pu=pu;ligne.__epi=1}else o.l.push({lib,q:n,pu,__epi:1});
    o.ensNoms=noms;o.ensPrevu=n;lignesEditeur(box,o);rxEpiInfo(ov);m.close();toast(`${n} salarié(s) ajouté(s) au devis`)}}
{const _dF3=devisForm;devisForm=function(src){const avant=rxDernierOv();const r=_dF3.apply(this,arguments);

<script>
/* ============ RUNIXO CONTRÔLE : 📁 Documents (tout), 🌐 Espace en ligne, 🕓 Traçabilité – 14/11/2026 ============ */
(function(){
  if(!RX_MENU.some(m=>m[0]==="esp")){const i=RX_MENU.findIndex(m=>m[0]==="docs");RX_MENU.splice(i+1,0,["esp","🌐","Espace en ligne"],["trace","🕓","Traçabilité"])}

/* --- suppression : le nom du document et du client partent avec, pour la traçabilité --- */
{const _apiTr=api;api=async function(a,p){try{if(/^del/.test(a)&&p&&p.id&&!p._lib){const id=p.id;let lib="",ent="";
  const f=S.fic.find(x=>x.id===id),x=S.els.find(y=>y.id===id),r=S.res.find(y=>y.id===id),d=S.du.find(y=>y.id===id),e=S.ents.find(y=>y.id===id);
  if(f){lib=(RD_FT[f.type]||"Fiche")+(f.a?" "+f.a:"");ent=f.entId}else if(x){lib=x.libelle||"Équipement";ent=x.entId}else if(r){lib="Observation : "+String(r.texte||"").slice(0,60);ent=r.entId}
  else if(d){lib="Document unique v"+d.version;ent=d.entId}else if(e){lib=e.nom;ent=e.id}
  else{Object.keys(EPLIST||{}).forEach(k=>{const y=(EPLIST[k]||[]).find(z=>z.id===id);if(y){lib="Rapport EPI N° "+y.num+" – "+(y.salarie||"");ent=k}})}
  if(lib||ent)p={...p,_lib:lib,_ent:ent}}}catch(z){}
  return _apiTr.call(this,a,p)}}

const RD_FT={devis:"Devis",fact:"Facture",bonepi:"Bon EPI",hist:"Rapport archivé",autre:"Document",perso:"Formation",dae:"Défibrillateur"};
const RD_TY={devis:["📝","Devis"],fact:["💶","Factures"],bon:["📦","Bons EPI (récupération / restitution)"],vgp:["🏗️","Rapports VGP"],epi:["🦺","Rapports EPI"],duerp:["📋","Documents uniques"],verif:["🔧","Vérifications"],form:["🎓","Formations"],autre:["📄","Autres documents"]};
const RD_BON={a_recuperer:"à récupérer",recupere:"récupéré",restitue:"restitué"};
const rdFold=(k,def)=>{const v=store.get("reg3aim_fold_"+k);return v==null?def:v==="1"};
function rdDetails(k,titre,html,def=true){return `<details class="card rdsec" data-rdf="${k}" ${rdFold(k,def)?"open":""} style="padding:12px 14px;margin-bottom:14px"><summary style="cursor:pointer;font-weight:700;font-size:19px;list-style:none">${rdFold(k,def)?"▾":"▸"} ${titre}</summary><div style="margin-top:10px">${html}</div></details>`}
function rdFoldBind(M){M.querySelectorAll("details[data-rdf]").forEach(d=>{const sm=d.querySelector("summary");d.addEventListener("toggle",()=>{store.set("reg3aim_fold_"+d.dataset.rdf,d.open?"1":"0");sm.textContent=sm.textContent.replace(/^[▾▸]/,d.open?"▾":"▸")})})}
(function(){const st=document.createElement("style");st.textContent=`details.rdsec>summary::-webkit-details-marker{display:none}.rdrow{cursor:pointer}.rdrow:hover td{background:#F6F8FB}.rdrow.dbl td{background:#FDECEA}.rdtag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;background:#EEF0F3;color:#374151}.rdmask{background:#FDECEA;color:#B42318}.rdvis{background:#E5F3EB;color:#1B5E20}`;document.head.appendChild(st)})();

/* --- tous les documents (de tous les clients ou d'un seul) --- */
function rdTous(entId){const D=[],epDocs=new Set(),ok=id=>S.ents.some(e=>e.id===id)&&(!entId||id===entId);
  Object.keys(EPLIST||{}).forEach(k=>{if(!ok(k))return;(EPLIST[k]||[]).forEach(x=>{let o={};try{o=JSON.parse(x.data||"{}")}catch(z){}const d=String(x.date||"").slice(0,10);
    if(x.pdf){epDocs.add(x.pdf);D.push({cle:"epi:"+x.id,k:"epi",t:"epi",d,titre:`Rapport EPI N° ${x.num}${o.rev?" – rév. "+o.rev:""} – ${x.salarie||""}`,entId:k,url:x.pdf,x})}
    if(o.recap&&!D.some(z=>z.url===o.recap)){epDocs.add(o.recap);D.push({cle:"",k:"recap",t:"epi",d,titre:"Récapitulatif du contrôle EPI",entId:k,url:o.recap})}})});
  S.els.forEach(x=>{if(!ok(x.entId)||!x.doc||x.doc==="#"||epDocs.has(x.doc))return;D.push({cle:"el:"+x.id,k:"el",t:x.rub==="lev"?"vgp":x.rub==="form"?"form":x.rub==="epi"?"epi":"verif",d:String(x.dernier||x.majLe||"").slice(0,10),titre:x.libelle+(x.ref?" – "+x.ref:""),entId:x.entId,url:x.doc,x})});
  S.fic.forEach(f=>{if(!ok(f.entId))return;const has=f.doc&&f.doc!=="#";let t;
    if(f.type==="devis")t="devis";else if(f.type==="fact")t="fact";else if(f.type==="bonepi")t="bon";else if(!has||["plan","cfg","ensepi","daej"].includes(f.type))return;
    else t=f.type==="hist"?({lev:"vgp",epi:"epi",form:"form"}[f.b]||"verif"):f.type==="perso"?"form":"autre";
    const titre=t==="devis"?"Devis "+(f.a||""):t==="fact"?"Facture "+(f.a||"")+(FA_ST[f.b]?" – "+FA_ST[f.b][0].toLowerCase():""):t==="bon"?"Bon "+(f.a||"")+(RD_BON[f.b]?" – "+RD_BON[f.b]:""):(f.a||"Document");
    D.push({cle:"fic:"+f.id,k:"fic",t,d:String(f.date||"").slice(0,10),titre,num:(t==="devis"||t==="fact"||t==="bon")?String(f.a||""):"",entId:f.entId,url:has?f.doc:"",f})});
  S.du.filter(d=>d.statut==="validé"&&ok(d.entId)).forEach(d=>D.push({cle:"du:"+d.id,k:"du",t:"duerp",d:String(d.date||"").slice(0,10),titre:`Document unique – version ${d.version}`,entId:d.entId,du:d}));
  /* anti-doublon : même numéro, ou même fichier */
  const vu={};D.forEach(r=>{const ks=[];if(r.num)ks.push(r.t+"#"+r.num);if(r.url)ks.push("u#"+r.url);ks.forEach(k=>(vu[k]=vu[k]||[]).push(r))});
  Object.values(vu).filter(g=>g.length>1).forEach(g=>g.forEach(r=>r.dbl=true));
  return D.sort((a,b)=>String(b.d).localeCompare(String(a.d)))}
const rdEnt=r=>S.ents.find(e=>e.id===r.entId)||{};
async function rdApercu(r){const e=rdEnt(r);
  if(r.k==="du")return pdfFlow(e,"Document unique – version "+r.du.version,()=>exportDUERP(e,r.du));
  if(r.k==="fic"){if(r.f.type==="bonepi"&&!r.url)return pdfFlow(e,"Bon "+r.f.a,()=>rxBonPdf(r.f));return rxApercu(r.f)}
  return rxApercu({doc:r.url,entId:r.entId,a:r.titre,type:"autre"})}
async function rdFichier(r){const e=rdEnt(r);
  if(r.k==="du")return exportDUERP(e,r.du);
  if(r.k==="fic"&&!rxDrvId(r.url)){if(r.f.type==="bonepi")return rxBonPdf(r.f);if(r.f.type==="fact"||r.f.type==="devis")return rxPdfDe(r.f,false)}
  return null}
async function rdTelecharge(r){const id=rxDrvId(r.url);if(id){rxDlDrive(id);toast("Téléchargement lancé : "+r.titre);return}
  const p=await rdFichier(r);if(p){rxDl(URL.createObjectURL(p.blob),p.name);toast("Téléchargé : "+p.name);return}
  if(r.url)window.open(r.url,"_blank","noopener")}
async function rdZip(L){const gen=[],drv=[];for(const r of L){if(rxDrvId(r.url))drv.push(r);else gen.push(r)}
  if(gen.length){await need("jszip");const z=new JSZip(),noms={};for(const r of gen){const p=await rdFichier(r);if(!p)continue;let n=p.name;while(noms[n])n=n.replace(/(\.pdf)?$/,"_2.pdf");noms[n]=1;z.file(n,p.blob)}
    const b=await z.generateAsync({type:"blob"});rxDl(URL.createObjectURL(b),"Documents_RUNIXO_"+today()+".zip")}
  drv.forEach((r,i)=>setTimeout(()=>rxDlDrive(rxDrvId(r.url)),i*900));
  toast(drv.length?`${drv.length} PDF du Drive en téléchargement${gen.length?" + un fichier .zip":""} (autorisez les téléchargements multiples si Chrome le demande)`:"Fichier .zip téléchargé")}
function rdPeutSuppr(r){return r.k!=="recap"}
async function rdSupprime(L){L=L.filter(rdPeutSuppr);if(!L.length){toast("Ces documents ne se suppriment pas d’ici");return false}
  const em=L.filter(r=>r.k==="fic"&&r.f.type==="fact"&&r.f.b!=="a_emettre");
  let msg=L.length===1?`Supprimer « ${L[0].titre} » (${rdEnt(L[0]).nom||""}) ?`:`Supprimer ces ${L.length} documents ?`;
  if(L.some(r=>r.k==="el"))msg+="\n\nPour un équipement, seul le document est retiré : l’équipement et sa date de vérification restent.";
  if(em.length)msg+=`\n\n⚠️ ${em.length===1?"La facture "+em[0].f.a+" est déjà émise":em.length+" factures sont déjà émises"}. La loi impose une numérotation continue : pour annuler une facture émise, faites plutôt un avoir. La suppression sera notée dans la traçabilité.`;
  msg+="\n\nLes PDF déjà rangés dans votre Drive restent dans le Drive.";
  if(!confirm(msg))return false;
  for(const r of L){try{
    if(r.k==="fic"){await api("delFiche",{id:r.f.id});S.fic=S.fic.filter(x=>x.id!==r.f.id)}
    else if(r.k==="el"){const x=S.els.find(y=>y.id===r.x.id);if(!x)continue;const r2=await api("saveEl",{el:{...x,doc:""},_lib:"Document retiré : "+r.titre});const i=S.els.findIndex(y=>y.id===x.id);if(i>=0)S.els[i]=r2.el||{...x,doc:""}}
    else if(r.k==="du"){await api("delDuerp",{id:r.du.id});S.du=S.du.filter(x=>x.id!==r.du.id)}
    else if(r.k==="epi"){await api("delEPI",{id:r.x.id});EPLIST[r.entId]=(EPLIST[r.entId]||[]).filter(y=>y.id!==r.x.id)}
  }catch(z){toast("« "+r.titre+" » : "+z.message)}}
  setTimeout(saveCache,0);toast(L.length+" document(s) supprimé(s)");return true}
function rdOuvre(r){if(r.k==="fic"){if(r.f.type==="fact")return factForm(r.f);if(r.f.type==="devis")return devisForm(r.f);if(r.f.type==="bonepi")return rxBonForm(r.f)}
  V={view:"ent",ent:r.entId,tab:r.t==="duerp"?"duerp":"docs"};render();scrollTo(0,0)}

/* --- 📁 Documents : tout ce que vous faites --- */
let RDF={t:"",ent:"",du:"",au:"",q:""};
RXMODS.docs=M=>{
  const draw=()=>{const ALL=rdTous(),f=norm2(RDF.q||"");
    const L=ALL.filter(r=>(!RDF.t||r.t===RDF.t)&&(!RDF.ent||r.entId===RDF.ent)&&(!RDF.du||r.d>=RDF.du)&&(!RDF.au||(r.d&&r.d<=RDF.au))&&(!f||norm2(r.titre+" "+(rdEnt(r).nom||"")).includes(f)));
    const cnt={};ALL.forEach(r=>cnt[r.t]=(cnt[r.t]||0)+1);const dbl=L.filter(r=>r.dbl).length;

    M.innerHTML=rxHead("📁 Documents","Tout ce que vous faites : devis, factures, bons, rapports VGP et EPI, documents uniques, documents déposés")+
     `<div class="quick" style="margin:0 0 10px;display:flex;flex-wrap:wrap;gap:6px">${[["","Tous ("+ALL.length+")"]].concat(Object.keys(RD_TY).filter(k=>cnt[k]).map(k=>[k,RD_TY[k][0]+" "+RD_TY[k][1]+" ("+cnt[k]+")"])).map(([k,l])=>`<button class="chip" data-rdt="${k}" style="${RDF.t===k?"border-style:solid;border-color:#1F5FA8;color:var(--ink);font-weight:600":""}">${l}</button>`).join("")}</div>
     <div class="rxbar" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px"><select id="rd_e" style="min-width:200px"><option value="">🏢 Tous les clients</option>${ents.map(id=>`<option value="${id}" ${RDF.ent===id?"selected":""}>${esc(rxNom(id))}</option>`).join("")}</select>
      <label style="display:flex;gap:4px;align-items:center">Du <input type="date" id="rd_du" value="${esc(RDF.du)}"></label><label style="display:flex;gap:4px;align-items:center">au <input type="date" id="rd_au" value="${esc(RDF.au)}"></label>
      <input id="rd_q" placeholder="🔎 Rechercher un document ou un client…" value="${esc(RDF.q)}" style="flex:1;min-width:220px"></div>
     ${dbl?`<div class="card" style="padding:10px 14px;margin:0 0 10px;border-left:5px solid var(--bad)"><b style="color:var(--bad)">⚠️ ${dbl} document(s) en double</b> (même numéro ou même fichier) : surlignés en rouge ci-dessous.</div>`:""}
     <div class="card" id="rd_bar" style="display:none;padding:10px 14px;margin:0 0 10px;gap:8px;align-items:center;flex-wrap:wrap;border:2px solid #E87722"><b id="rd_n"></b><span style="flex:1"></span><button class="btn sm" data-rdg="zip">⬇ Télécharger (.zip)</button><button class="btn sm danger ghost" data-rdg="del">🗑 Supprimer</button><button class="btn sm ghost" data-rdg="none">Tout décocher</button></div>
     <div class="card" style="padding:4px 8px;overflow-x:auto"><table class="rxt" id="rd_tab"><tr><th style="width:30px"><input type="checkbox" id="rd_all" aria-label="Tout cocher"></th><th>Date</th><th>Type</th><th>Document</th><th>Client</th><th style="text-align:right">Actions</th></tr>
     ${L.slice(0,600).map((r,i)=>`<tr class="rdrow${r.dbl?" dbl":""}" data-ri="${i}"><td><input type="checkbox" data-rdc="${i}" aria-label="Cocher"></td><td style="white-space:nowrap">${r.d?fr(r.d):"—"}</td><td style="white-space:nowrap">${RD_TY[r.t][0]} ${esc(RD_TY[r.t][1].replace(/ \(.*\)/,""))}</td><td>${r.dbl?"⚠️ ":""}${esc(r.titre)}</td><td>${esc(rdEnt(r).nom||"")}</td>
      <td style="white-space:nowrap;text-align:right"><button class="btn sm" data-rda="ap" title="Aperçu">👁</button> <button class="btn sm" data-rda="dl" title="Télécharger">⬇</button> ${rdPeutSuppr(r)?`<button class="btn sm danger ghost" data-rda="del" title="Supprimer">🗑</button>`:""}</td></tr>`).join("")||`<tr><td colspan="6" class="hint" style="padding:14px">Aucun document${RDF.t||RDF.ent||RDF.q||RDF.du||RDF.au?" avec ces filtres":""}.</td></tr>`}</table>

const rpDeja=id=>drvHas(id)||Object.values(EPLIST||{}).some(L=>(L||[]).some(x=>String(x.pdf||"").includes(id)||String(x.data||"").includes(id)));
function rpEntATS(){const N=s=>norm2(s||"");return S.ents.find(e=>N(e.nom)===N(RP_DRV.client))||S.ents.find(e=>RP_DRV.al.some(a=>N(e.nom).includes(N(a))&&N(a).length>3))||S.ents.find(e=>N(e.nom)==="ats")}
async function rpImport(){if(S.ents.some(e=>!EPLIST[e.id])){toast("Vérification des rapports déjà présents…");try{await rxEpiCharge(false)}catch(z){}}
  const R=RP_DRV.r,e0=rpEntATS(),deja=R.filter(r=>rpDeja(r.id)).length,dos=[...new Set(R.map(r=>r.dos))];
  const m=modal("📥 Anciens rapports ATS – dossier Drive","#12213F",`
   <p style="margin:0">J’ai repris votre dossier Drive « CONTROLE EPI › ATS » : <b>${R.length} rapports</b> (PDF et quelques Word quand il n’y a pas de PDF), de juin 2025 à juin 2026. Les photos, fichiers Excel de travail et bons de commande ne sont pas repris. Les PDF restent dans votre Drive : rien n’est déplacé ni modifié.</p>
   <label class="f">Client dans le registre<select id="ri_e">${S.ents.slice().sort((a,b)=>a.nom.localeCompare(b.nom,"fr")).map(e=>`<option value="${e.id}" ${e0&&e0.id===e.id?"selected":""}>${esc(e.nom)}</option>`).join("")}</select></label>
   ${deja?`<p class="hint" style="margin:0">${deja} rapport(s) déjà présent(s) dans le registre : ils ne seront pas ajoutés une deuxième fois.</p>`:""}
   <p class="hint" style="margin:0">Décochez ce que vous ne voulez pas (par exemple les versions en double du 11 septembre 2025). Vous pouvez changer le type EPI / VGP ligne par ligne.</p>
   <div style="max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:8px"><table class="rxt" style="width:100%"><tr><th style="width:30px"><input type="checkbox" id="ri_all" checked></th><th>Date</th><th>Rapport</th><th>Type</th></tr>
    ${dos.map(d=>`<tr class="rxg"><td colspan="4" style="background:#F1F4F9;padding:6px 10px"><b>📁 ${esc(d)}</b></td></tr>`+R.map((r,i)=>r.dos!==d?"":`<tr data-rii="${i}"><td><input type="checkbox" data-on ${rpDeja(r.id)?"disabled":"checked"}></td><td style="white-space:nowrap">${fr(r.d)}</td><td>${esc(r.n)} ${rpDeja(r.id)?`<span class="rdtag rdvis">déjà là</span>`:""} <a href="https://drive.google.com/file/d/${r.id}/view" target="_blank" rel="noopener" class="hint">voir</a></td>
      <td><select data-t><option value="epi" ${r.t==="epi"?"selected":""}>🦺 EPI</option><option value="vgp" ${r.t==="vgp"?"selected":""}>🏗️ VGP</option></select></td></tr>`).join("")).join("")}</table></div>
   <div id="ri_pg" style="display:none"><div style="height:10px;background:var(--bg);border-radius:6px;overflow:hidden"><div id="ri_bar" style="height:100%;width:0;background:#E87722;transition:width .3s"></div></div><div class="hint" id="ri_t" style="margin-top:6px"></div></div><div class="err" id="ri_x"></div>`,
   `<button class="btn" data-x2>Fermer</button><button class="btn pri" id="ri_go">Importer</button>`);
  m.ov.querySelector(".modal").style.maxWidth="980px";let busy=false;
  m.ov.querySelector("[data-x2]").onclick=()=>{if(busy&&!confirm("L’import est en cours. Fermer quand même ? (vous pourrez le relancer : il reprendra là où il s’est arrêté)"))return;busy=false;m.close();render()};
  m.q("#ri_all").onchange=ev=>m.ov.querySelectorAll("[data-on]:not(:disabled)").forEach(c=>c.checked=ev.target.checked);
  m.q("#ri_go").onclick=async()=>{const entId=m.q("#ri_e").value;if(!entId){m.q("#ri_x").textContent="Choisissez le client.";return}
    const job=[...m.ov.querySelectorAll("tr[data-rii]")].filter(tr=>tr.querySelector("[data-on]").checked).map(tr=>({...R[Number(tr.dataset.rii)],t:tr.querySelector("[data-t]").value}));
    if(!job.length){m.q("#ri_x").textContent="Cochez au moins un rapport.";return}
    const b=m.q("#ri_go");b.disabled=true;b.textContent="⏳ Import en cours…";busy=true;m.q("#ri_pg").style.display="block";m.q("#ri_x").textContent="";
    let n=0,sk=0;const call=async(a,p)=>{try{return await api(a,p)}catch(z){await new Promise(r=>setTimeout(r,1500));return await api(a,p)}};
    try{for(const r of job){if(!busy)break;
        if(rpDeja(r.id)){sk++}else{const num=(r.n.match(/N° \d+/)||[""])[0];
          const res=await call("saveFiche",{fic:{type:"hist",entId,date:r.d,a:r.n,b:r.t==="vgp"?"lev":"epi",c:num,d:"Ancien rapport – Drive ATS",doc:drvU(r.id)}});S.fic.push(res.fic);n++}
        m.q("#ri_bar").style.width=Math.round((n+sk)/job.length*100)+"%";m.q("#ri_t").textContent=`${n+sk} / ${job.length} – ${r.n}`}
      setTimeout(saveCache,0);m.q("#ri_t").textContent=`Terminé : ${n} rapport(s) importé(s)${sk?`, ${sk} déjà présent(s)`:""}. Ils sont dans 📑 Rapports et dans l’espace du client.`;b.textContent="Terminé";toast(n+" rapport(s) importé(s)")}
    catch(z){m.q("#ri_x").textContent="Arrêt : "+z.message+" — relancez « Importer », l’import reprendra là où il s’est arrêté.";b.disabled=false;b.textContent="Reprendre l’import"}
    busy=false}}
function rpSlot(M){const sl=M.querySelector("#rp_slot");if(!sl)return;const n=RP_DRV.r.filter(r=>!rpDeja(r.id)).length;
  sl.innerHTML=`<button class="btn ${n?"pri":""}" id="rp_imp" title="Reprendre les anciens rapports ATS depuis votre Drive">📥 Anciens rapports ATS${n?` (${n} à importer)`:" ✔"}</button>`;sl.querySelector("#rp_imp").onclick=rpImport}

</script>
