<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registre de sécurité – 3AIM CFA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --navy:#12213F;--orange:#E87722;--gold:#F5A623;
  --bg:#F3F4F6;--card:#FFFFFF;--ink:#14213D;--ink2:#4B5563;--ink3:#8A93A3;--line:#E3E6EB;
  --ok:#1E7F4F;--okbg:#E5F3EB;--warn:#A86400;--warnbg:#FDF1DC;--bad:#B42318;--badbg:#FCE8E6;--none:#6B7280;--nonebg:#EEF0F3;
  --r-inst:#1F5FA8;--r-lev:#D99A00;--r-epi:#E87722;--r-inc:#C62828;--r-form:#1E7F4F;--r-obs:#5B6474;--r-id:#12213F;
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1525;--card:#16203A;--ink:#EEF1F6;--ink2:#B7C0CF;--ink3:#7E8AA0;--line:#26324D;
  --okbg:#14372A;--ok:#6FD3A0;--warnbg:#3D2E12;--warn:#F5B94F;--badbg:#3E1A1A;--bad:#F28B82;--nonebg:#232E47;--none:#A3AEC2;color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Barlow,"Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.5;color:var(--ink);background:var(--bg)}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-weight:600;line-height:1.15;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--navy);color:#fff;border-bottom:4px solid var(--orange)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;background:var(--navy)}
.top .in{max-width:1180px;margin:auto;display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.mark{width:36px;height:36px;border-radius:7px;background:var(--orange);display:grid;place-items:center;font-family:"Barlow Condensed";font-weight:700;font-size:17px;color:#fff}
.brand b{font-family:"Barlow Condensed";font-size:20px;font-weight:600;display:block;line-height:1}
.brand small{color:#C9D2E3;font-size:12.5px}
.top .sp{flex:1}
.top .who{font-size:13px;color:#C9D2E3}
.btn{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:8px 13px;display:inline-flex;align-items:center;gap:7px;font-weight:500;font-size:14px;transition:background .15s}
.btn:hover{background:var(--bg)}
.btn.pri{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.pri:hover{background:#cf6611}
.btn.dk{background:transparent;border-color:#3B4C72;color:#fff}
.btn.dk:hover{background:#1E3158}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.wrap{max-width:1180px;margin:auto;padding:22px 18px 60px}
.demo{background:var(--warnbg);color:var(--warn);text-align:center;font-size:13px;padding:6px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px}
.hint{color:var(--ink2);font-size:13.5px}
.grid{display:grid;gap:14px}
/* tableau de bord */
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin:16px 0 22px}
.kpi{padding:14px 16px;border-left:5px solid var(--c,var(--navy));border-radius:0 10px 10px 0}
.kpi .n{font-family:"Barlow Condensed";font-size:34px;font-weight:700;line-height:1}
.kpi .l{color:var(--ink2);font-size:13px}
.layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px}
.sec-h h2{font-size:22px}
.ents{display:grid;gap:10px}
.ent{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.ent:hover{border-color:var(--ink3)}
.ent .nm{font-weight:600;font-size:16px}
.ent .al{font-size:13px;margin-top:2px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pill{font-size:12px;padding:2px 8px;border-radius:20px;font-weight:500;white-space:nowrap}
.p-ok{background:var(--okbg);color:var(--ok)}.p-bientot{background:var(--warnbg);color:var(--warn)}.p-retard,.p-nc{background:var(--badbg);color:var(--bad)}.p-vide{background:var(--nonebg);color:var(--none)}
/* jauge = étiquette de contrôle */
.gauge{--v:0;--gc:var(--ok);width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--gc) calc(var(--v)*1%),var(--line) 0);display:grid;place-items:center;position:relative}
.gauge::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--card)}
.gauge span{position:relative;z-index:1;font-family:"Barlow Condensed";font-weight:700;font-size:19px}
.gauge.big{width:118px;height:118px}.gauge.big::after{inset:11px}.gauge.big span{font-size:34px}
.opp{padding:14px 16px;border-top:4px solid var(--orange)}
.opp li{margin:6px 0;font-size:14px}
.opp .to{color:var(--orange);font-weight:600}
.feed{padding:6px 14px;max-height:360px;overflow:auto}
.feed div{padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.feed div:last-child{border:0}
.feed small{color:var(--ink3);display:block}
/* fiche entreprise */
.hero{display:grid;grid-template-columns:240px minmax(0,1fr) auto;gap:20px;padding:18px;align-items:center}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}.photo{max-width:320px}}
.photo{aspect-ratio:4/3;border-radius:8px;border:2px dashed var(--line);display:grid;place-items:center;overflow:hidden;background:var(--bg);color:var(--ink3);font-size:13px;text-align:center;cursor:pointer;position:relative}
.photo img{width:100%;height:100%;object-fit:cover}
.photo.has{border-style:solid}
.photo .chg{position:absolute;bottom:6px;right:6px;background:rgba(18,33,63,.82);color:#fff;font-size:12px;padding:3px 8px;border-radius:5px}
.hero h1{font-size:32px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:4px 18px;margin-top:8px;font-size:14px}
.meta span{color:var(--ink3)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid var(--line);margin-top:6px}
.tab{border:0;background:none;padding:10px 13px 9px;border-bottom:4px solid transparent;margin-bottom:-2px;white-space:nowrap;font-weight:500;color:var(--ink2);display:flex;align-items:center;gap:7px}
.tab .dot{width:10px;height:10px;border-radius:3px;background:var(--rc)}
.tab.on{color:var(--ink);border-bottom-color:var(--rc)}
.tab .ct{font-size:12px;background:var(--bg);border-radius:10px;padding:0 7px}
.tab .ct.alert{background:var(--badbg);color:var(--bad)}
.panel{margin-top:16px}
.rubh{display:flex;align-items:center;gap:12px;padding:14px 16px;border-left:6px solid var(--rc);border-radius:0 10px 10px 0;margin-bottom:12px;flex-wrap:wrap}
.rubh h2{font-size:24px}
.rubh p{margin:2px 0 0;font-size:13px;color:var(--ink2)}
.rubh .sp{flex:1}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.chip{border:1px dashed var(--ink3);background:transparent;border-radius:20px;padding:4px 11px;font-size:13px;color:var(--ink2)}
.chip:hover{border-style:solid;border-color:var(--rc);color:var(--ink)}
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:6px minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 12px 10px 0;overflow:hidden}
.row .bar{align-self:stretch;background:var(--sc)}
.row .t{font-weight:600}
.row .d{font-size:13px;color:var(--ink2)}
.row .k{font-size:12px;color:var(--ink3)}
.row .bt{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:760px){.row{grid-template-columns:6px minmax(0,1fr);}.row>*:nth-child(n+3){grid-column:2}.row .bt{justify-content:flex-start}}
.empty{padding:26px;text-align:center;color:var(--ink2)}
.res{padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border-left:5px solid var(--sc);border-radius:0 10px 10px 0}
.res.done{opacity:.7}
/* modale */
.ov{position:fixed;inset:0;background:rgba(10,16,30,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal{width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--card);border-radius:12px;border-top:6px solid var(--rc,var(--orange))}
.modal header{padding:16px 20px 6px;display:flex;justify-content:space-between;align-items:center}
.modal header h2{font-size:24px}
.modal .bd{padding:6px 20px 8px;display:grid;gap:12px}
.modal footer{padding:12px 20px 18px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
label.f{display:grid;gap:4px;font-size:13px;color:var(--ink2);font-weight:500}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);border-radius:7px;padding:9px 10px;background:var(--card);font-size:15px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--card);padding:9px 6px;font-weight:500;font-size:14px}
.seg button.on[data-v="C"]{background:var(--ok);color:#fff}.seg button.on[data-v="R"]{background:var(--warn);color:#fff}.seg button.on[data-v="NC"]{background:var(--bad);color:#fff}
.calc{background:var(--bg);border-radius:8px;padding:10px 12px;font-size:14px}
.err{color:var(--bad);font-size:13px;min-height:18px}
/* connexion */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--navy)}
.lbox{width:min(420px,100%);background:var(--card);border-radius:14px;overflow:hidden}
.lbox .hd{padding:26px 26px 18px;border-bottom:4px solid var(--orange)}
.lbox .hd h1{font-size:34px}
.lbox .bd{padding:22px 26px 26px;display:grid;gap:14px}
.stripes{height:8px;background:repeating-linear-gradient(135deg,#F5A623 0 14px,#12213F 14px 28px)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;z-index:60;font-size:14px;max-width:90vw}
.qr{display:grid;place-items:center;padding:8px;background:#fff;border-radius:8px;width:max-content;margin:auto}
.mono{font-family:Consolas,"Courier New",monospace;background:var(--bg);padding:2px 7px;border-radius:5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const DEMO=!API_URL;
let S={role:null,code:null,entId:null,ents:[],els:[],res:[],jr:[],photos:{}};
let V={view:"dash",ent:null,tab:"id"};
let DB=null;
async function api(action,p={}){
  if(DEMO)return demo(action,p);
  const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,code:S.code,...p})});
  const j=await r.json();if(!j.ok)throw new Error(j.err||"Erreur");return j;
}
function demo(a,p){
  if(!DB){DB=seedData();DB.jr=[{date:today()+" 08:12",entId:"ekaz",qui:"admin",action:"VGP enregistrées (juillet 2026)"}];DB.photos={}}
  const role=p.code==="DEMO"||S.code==="DEMO"?"admin":null;
  const findE=c=>DB.ents.find(e=>e.code===c||e.lecture===c);
  const who=(()=>{const c=p.code||S.code;if(c==="DEMO")return{role:"admin"};const e=findE(c);return e?{role:e.code===c?"client":"lecture",entId:e.id}:null})();
  if(!who)throw new Error("Code d’accès inconnu");
  const log=(entId,txt)=>DB.jr.unshift({date:today()+" "+new Date().toTimeString().slice(0,5),entId,qui:who.role,action:txt});
  switch(a){
   case"login":return{role:who.role,entId:who.entId||null};
   case"load":{const f=x=>who.role==="admin"||x.entId===who.entId;return{role:who.role,entId:who.entId||null,ents:DB.ents.filter(e=>who.role==="admin"||e.id===who.entId).map(e=>({...e})),els:DB.els.filter(f).map(x=>({...x})),res:DB.res.filter(f).map(x=>({...x})),jr:DB.jr.filter(f)}}
   case"saveEnt":{const e=p.ent;if(!e.id){e.id=rid("e");e.code="ENT-"+gen(6);e.lecture="LEC-"+gen(10);e.relances=e.relances||"oui"}const i=DB.ents.findIndex(x=>x.id===e.id);if(i>=0)DB.ents[i]={...DB.ents[i],...e};else DB.ents.push(e);log(e.id,i>=0?"Fiche entreprise mise à jour":"Entreprise créée");return{ent:DB.ents.find(x=>x.id===e.id)}}
   case"delEnt":DB.ents=DB.ents.filter(x=>x.id!==p.id);DB.els=DB.els.filter(x=>x.entId!==p.id);DB.res=DB.res.filter(x=>x.entId!==p.id);return{};
   case"newCode":{const e=DB.ents.find(x=>x.id===p.id);if(p.kind==="lecture")e.lecture="LEC-"+gen(10);else e.code="ENT-"+gen(6);return{ent:{...e}}}
   case"saveEl":{const el=p.el;if(!el.id)el.id=rid("x");el.prochain=el.dernier&&el.per?addM(el.dernier,el.per):"";const i=DB.els.findIndex(x=>x.id===el.id);if(i>=0)DB.els[i]=el;else DB.els.push(el);log(el.entId,(el.dernier?"Vérification enregistrée : ":"Élément ajouté : ")+el.libelle);return{el:{...el}}}
   case"delEl":DB.els=DB.els.filter(x=>x.id!==p.id);return{};
   case"saveRes":{const r=p.res;if(!r.id)r.id=rid("r");const i=DB.res.findIndex(x=>x.id===r.id);if(i>=0)DB.res[i]=r;else DB.res.push(r);log(r.entId,(r.levee?"Réserve levée : ":"Observation enregistrée : ")+r.texte.slice(0,70));return{res:{...r}}}
   case"delRes":DB.res=DB.res.filter(x=>x.id!==p.id);return{};
   case"upload":{if(p.kind==="photo"){DB.photos[p.entId]="data:"+p.mime+";base64,"+p.data;const e=DB.ents.find(x=>x.id===p.entId);e.photoId="demo";log(p.entId,"Photo de l’entreprise mise à jour")}else log(p.entId,"Document déposé : "+p.name);return{id:"demo",url:"#"}}
   case"photo":return{data:DB.photos[p.entId]||""};
   case"sendAccess":{const e=DB.ents.find(x=>x.id===p.id);if(!e.email)throw new Error("Aucune adresse mail sur la fiche de "+e.nom);return{}}
   case"testMail":return{};
   case"seed":return{};
  }
}

}

/* ============ FICHIERS ============ */
async function saveFile(name,blob){
  try{if(window.claude&&window.claude.use){const dl=await window.claude.use("downloads");if(dl){await dl.save({filename:name,data:blob});return}}}catch(x){if(x&&x.code==="declined")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
const dataBlob=u=>{const [h,b]=u.split(","),bin=atob(b),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:h.slice(5).split(";")[0]})};

const toB64=f=>new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]);r.onerror=ko;r.readAsDataURL(f)});
async function uploadFile(e,f,kind){if(f.size>15e6)throw new Error("Fichier trop lourd (15 Mo maximum)");return api("upload",{entId:e.id,kind,name:f.name,mime:f.type||"application/octet-stream",data:await toB64(f)})}
async function uploadPhoto(e,f){
  if(!f)return;if(!f.type.startsWith("image/")){toast("Choisis une image");return}
  const img=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=URL.createObjectURL(f)});
  const k=Math.min(1,1400/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  const url=c.toDataURL("image/jpeg",.85);toast("Envoi de la photo…");
  try{await api("upload",{entId:e.id,kind:"photo",name:"photo_"+e.nom+".jpg",mime:"image/jpeg",data:url.split(",")[1]});S.photos[e.id]=url;e.photoId=e.photoId||"ok";renderEnt();toast("Photo enregistrée")}catch(z){toast(z.message)}
}

function hdr(doc,e,title,col,sub){
  doc.setFillColor(...hex("#12213F"));doc.rect(0,0,210,12,"F");doc.setTextColor(255,255,255);doc.setFont("helvetica","bold");doc.setFontSize(9);doc.text(P(e.nom),12,7.8);
  doc.setFont("helvetica","normal");doc.setTextColor(245,166,35);doc.text("3AIM CFA · Registre de sécurité",198,7.8,{align:"right"});
  doc.setFillColor(...col);doc.rect(12,18,4,sub?14:10,"F");doc.setTextColor(...col);doc.setFont("helvetica","bold");doc.setFontSize(17);doc.text(P(title),19,25);
  if(sub){doc.setFont("helvetica","normal");doc.setFontSize(8.5);doc.setTextColor(110,118,132);doc.text(P(sub),19,30.5)}
  return sub?38:34;
}
