<script>/* Lien Lakaz : lire les infos envoyées avant que la page ne nettoie l'adresse */try{const r=new URLSearchParams(location.search).get("lakaz");if(r){sessionStorage.setItem("lakaz_imp",r);const u=new URL(location.href);u.searchParams.delete("lakaz");history.replaceState(null,"",u.pathname+u.search)}}catch(e){}</script>

<script>/* Mise à jour automatique : à l'ouverture (puis toutes les 10 min), la page vérifie s'il existe une version plus récente sur le site et se recharge toute seule. */
const APP_VER="2026-11-14-b";
(function(){
  try{const u=new URL(location.href);if(u.searchParams.has("v")||u.searchParams.has("_")){u.searchParams.delete("v");u.searchParams.delete("_");history.replaceState(null,"",u.pathname+u.search+u.hash)}}catch(e){}
  const busy=()=>!!document.querySelector(".ov,#vg")||(()=>{try{return!!sessionStorage.getItem("lakaz_imp")}catch(e){return false}})();
  async function check(first){
    if(!/^https?:/.test(location.protocol))return;
    try{const r=await fetch(location.pathname+"?_="+Date.now(),{cache:"no-store"});if(!r.ok)return;
      const m=(await r.text()).match(/const APP_VER="([^"]+)"/);if(!m||m[1]===APP_VER)return;
      const k="reg3aim_maj_"+m[1];let n=0;try{n=Number(sessionStorage.getItem(k)||0)}catch(e){}
      if(n>=2)return; /* le site n'est pas encore à jour partout : on réessaiera plus tard */
      try{sessionStorage.setItem(k,String(n+1))}catch(e){}
      if(!busy()){location.replace(location.pathname+"?v="+encodeURIComponent(m[1])+"&_="+Date.now()+location.hash);return}
      if(!document.getElementById("majb")){const b=document.createElement("div");b.id="majb";b.setAttribute("role","status");b.style.cssText="position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:200;background:#1B5E20;color:#fff;padding:10px 14px;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.3);display:flex;gap:10px;align-items:center;font-size:14px";
        b.innerHTML='Une nouvelle version du registre est disponible.<button style="background:#fff;color:#1B5E20;border:0;border-radius:7px;padding:6px 10px;font-weight:600;cursor:pointer">Mettre à jour</button>';
        b.querySelector("button").onclick=()=>location.replace(location.pathname+"?v="+encodeURIComponent(m[1])+"&_="+Date.now()+location.hash);document.body.appendChild(b)}
    }catch(e){}}
  check(true);setInterval(()=>check(false),10*60e3);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)check(false)});
})();</script>

const fics=(id,t)=>S.fic.filter(f=>f.entId===id&&(!t||f.type===t));

function ficheForm(e,type,f){
  f=f||{type,entId:e.id,date:type==="contact"?"":today()};const T=FT[type];
  const inp=([k,l,t,opts])=>t==="select"?`<label class="f">${l}<select data-k="${k}">${opts.map(o=>`<option ${f[k]===o?"selected":""}>${esc(o)}</option>`).join("")}</select></label>`:`<label class="f">${l}<input data-k="${k}" type="${t||"text"}" value="${esc(f[k]||"")}"></label>`;
  const m=modal((f.id?"Modifier – ":"")+T.n,T.c,`${T.f.map(inp).join("")}${type==="contact"?"":`<label class="f">Document joint (facultatif)<input type="file" id="fi_f"></label>`}<div class="calc" id="fi_c" style="${type==="cons"||type==="perso"?"":"display:none"}"></div><div class="err" id="fi_e"></div>`,
   `${f.id?`<button class="btn danger ghost" id="fi_d" style="margin-right:auto">Supprimer</button>`:""}<button class="btn" data-x2>Annuler</button><button class="btn pri" id="fi_s">Enregistrer</button>`);
  const g=k=>m.ov.querySelector(`[data-k="${k}"]`)?.value.trim()??"";
  const calc=()=>{if(type==="cons")m.q("#fi_c").innerHTML=g("date")?`Prochaine revue conseillée : <b>${fr(addM(g("date"),12))}</b>`:"Indique la date de mise à jour";
    if(type==="perso")m.q("#fi_c").innerHTML=g("date")&&g("d")?`Recyclage à prévoir avant le <b>${fr(addM(g("date"),g("d")))}</b>`:"Indique la date et la validité pour suivre le recyclage"};
  m.ov.querySelectorAll("[data-k]").forEach(x=>x.oninput=calc);calc();
  if(type==="perso"){const mi=m.ov.querySelector('[data-k="b"]'),va=m.ov.querySelector('[data-k="d"]');mi.onchange=()=>{if(!va.value)va.value=/SST/.test(mi.value)?24:12;calc()};if(!f.id&&!va.value)va.value=12}
  m.ov.querySelector("[data-x2]").onclick=m.close;
  if(m.q("#fi_d"))m.q("#fi_d").onclick=async()=>{if(!confirm("Supprimer cette ligne ?"))return;await api("delFiche",{id:f.id});S.fic=S.fic.filter(x=>x.id!==f.id);m.close();renderEnt()};
  m.q("#fi_s").onclick=async()=>{
    const o={...f,entId:e.id,type};T.f.forEach(([k])=>o[k]=g(k));
    if(!o.a&&type!=="trav"){m.q("#fi_e").textContent="Complète au moins le premier champ.";return}
    if(type==="cons")o.echeance=o.date?addM(o.date,12):"";
    if(type==="perso")o.echeance=o.date&&o.d?addM(o.date,o.d):"";
    const b=m.q("#fi_s");b.disabled=true;b.textContent="Enregistrement…";
    try{const fl=m.q("#fi_f")?.files[0];if(fl){const u=await uploadFile(e,fl,"doc");o.doc=u.url}
      const r=await api("saveFiche",{fic:o});const i=S.fic.findIndex(x=>x.id===r.fic.id);if(i>=0)S.fic[i]=r.fic;else S.fic.push(r.fic);
      if(type==="trav"&&o.d==="Défavorable"&&!f.id){const x=await api("saveRes",{res:{entId:e.id,elId:"",date:o.date||today(),texte:`Avis défavorable – ${o.a}${o.c?" ("+o.c+")":""} : lever les prescriptions de la commission`,gravite:"haute",levee:"",preuve:""}});S.res.push(x.res)}
      m.close();toast("Enregistré");renderEnt()}catch(z){b.disabled=false;b.textContent="Enregistrer";m.q("#fi_e").textContent=z.message}};
}
function listeFiches(e,type,box){
  const T=FT[type],L=fics(e.id,type).sort((a,b)=>String(b.date).localeCompare(a.date)),ro=S.role==="lecture";
  const pill=f=>{const s=statutF(f);return s==="none"?"":`<span class="pill p-${s}">${type==="cons"?(s==="ok"?"À jour":s==="vide"?"–":"À revoir"):type==="trav"?"Prochaine visite "+fr(f.echeance):s==="ok"?"Valide":s==="vide"?"Date à renseigner":s==="bientot"?"Recyclage à prévoir":"Recyclage dépassé"}</span>`};
  const line=f=>{
    if(type==="contact")return `<div><div class="t">${esc(f.a)}</div><div class="d">${esc(f.b||"")}</div>${f.e?`<div class="k">${esc(f.e)}</div>`:""}</div><div>${f.c?`<a href="tel:${esc(f.c.replace(/\s/g,""))}">${esc(f.c)}</a>`:""}${f.d?`<br><a href="mailto:${esc(f.d)}">${esc(f.d)}</a>`:""}</div>`;
    if(type==="trav")return `<div><div class="t">${esc(f.a)}</div><div class="d">${esc(f.b||"")}</div><div class="k">${esc([f.e,f.c].filter(Boolean).join(" · "))}</div></div><div><div class="k">Date</div>${fr(f.date)||"–"}${f.d?`<br><span class="pill ${f.d==="Favorable"?"p-ok":f.d==="Défavorable"?"p-nc":"p-bientot"}">Avis ${f.d.toLowerCase()}</span>`:""} ${f.echeance?pill(f):""}</div>`;
    if(type==="maint")return `<div><div class="t">${esc(f.a)}</div><div class="d">${esc(f.d||"")}</div><div class="k">${esc(f.b||"")}</div></div><div><div class="k">Date</div>${fr(f.date)||"–"}<br><span class="pill ${/Corrective/.test(f.c)?"p-bientot":"p-ok"}">${esc((f.c||"").split(" ")[0])}</span></div>`;

    if(type==="cons")return `<div><div class="t">${esc(f.a)}</div><div class="d">${esc(f.b||"")}</div><div class="k">${f.c?"Affichée : "+esc(f.c):""}</div></div><div><div class="k">Mise à jour</div>${fr(f.date)||"–"}<br>${pill(f)}</div>`;
    return `<div><div class="t">${esc(f.a)}</div><div class="d">${esc(f.b||"")}</div><div class="k">${esc(f.c||"")}</div></div><div><div class="k">Formé le</div>${fr(f.date)||"–"}<br>${pill(f)}</div>`;
  };
  box.innerHTML=`<div class="card rubh" style="--rc:${T.c}"><div><h2>${T.n}</h2>${T.ref?`<p>${T.ref}</p>`:""}</div><div class="sp"></div>${ro?"":`<button class="btn pri" data-fa="${type}">${T.add}</button>`}</div>
   <div class="rows">${L.map(f=>`<div class="card row fic" style="--sc:${T.c}"><div class="bar"></div>${line(f)}<div class="bt">${f.doc&&f.doc!=="#"?`<a class="btn sm" href="${esc(f.doc)}" target="_blank" rel="noopener">Document</a>`:""}${ro?"":`<button class="btn sm ghost" data-fm="${f.id}">Modifier</button>`}</div></div>`).join("")||`<div class="card empty">Rien n’est encore renseigné.</div>`}</div>`;
  if(ro)return;
  box.querySelectorAll(`[data-fa="${type}"]`).forEach(b=>b.onclick=()=>ficheForm(e,type));
  box.querySelectorAll("[data-fm]").forEach(b=>b.onclick=()=>ficheForm(e,type,S.fic.find(x=>x.id===b.dataset.fm)));

/* ============ MODULE DUERP ============ */
const DG="#2E7D32",DGD="#1B5E20";
const duList=id=>S.du.filter(d=>d.entId===id).sort((a,b)=>Number(b.version)-Number(a.version));
const duObj=d=>{if(!d._o){try{d._o=JSON.parse(d.data||"{}")}catch(x){d._o={}}d._o.units=d._o.units||[]}return d._o};
const RN=r=>Number(r.g||0)*Number(r.f||0);
const LV=v=>v>=8?"eleve":v>=4?"modere":"faible";
const LVL={faible:["Faible","#1E7F4F","#E5F3EB"],modere:["Modéré","#B26A00","#FDF1DC"],eleve:["Élevé","#B42318","#FCE8E6"]};
const MAI={bonne:"Bonne",moyenne:"Moyenne",insuffisante:"Insuffisante"};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
function newRisk(k){const r=DRK[k];const g=Number(r[5]),f=Number(r[6]),lv=LV(g*f);
  return{id:uid("k"),fam:r[1],d:r[2],s:r[3],dm:r[4],g,f,m:lv==="eleve"?"insuffisante":"moyenne",ex:r[7],ac:r[8],resp:"",dec:today(),delai:lv==="eleve"?3:lv==="modere"?6:12,fait:"",fo:r[9]}}
const echR=r=>r.dec&&r.delai?addM(r.dec,r.delai):"";
async function saveDu(d){const o=duObj(d);const row={id:d.id||"",entId:d.entId,version:d.version,metier:d.metier,date:d.date||"",redacteur:d.redacteur||"",effectif:d.effectif||"",statut:d.statut||"brouillon",data:JSON.stringify(o)};
  const r=await api("saveDuerp",{du:row});const i=S.du.findIndex(x=>x.id===r.du.id);r.du._o=o;if(i>=0)S.du[i]=r.du;else S.du.push(r.du);return r.du}
function duOpps(id){const d=duList(id)[0];if(!d)return[];const seen=new Set(),o=[];
  duObj(d).units.forEach(u=>u.risks.forEach(r=>{if(r.fo&&!r.fait&&!seen.has(r.fo)){seen.add(r.fo);o.push({t:`${r.fo} (DUERP – ${u.nom})`,qui:"Formation 3AIM CFA"})}}));return o}
function panelDuerp(e,pn){
  const L=duList(e.id),ro=S.role==="lecture";
  if(!L.length){
    pn.innerHTML=`<div class="card rubh" style="--rc:${DG}"><div><h2>Document unique (DUERP)</h2><p>Code du travail, articles L.4121-1 à L.4121-3 et R.4121-1 à R.4121-4</p></div></div>
    ${ro?`<div class="card empty">Aucun DUERP n’est encore enregistré.</div>`:`<div class="card" style="padding:18px;display:grid;gap:12px;max-width:640px">
     <h3 style="font-size:20px">Créer le DUERP de ${esc(e.nom)}</h3>
     <label class="f">Métier de l’entreprise<select id="du_m"><option value="">Choisir un métier…</option>${DM.map((m,i)=>`<option value="${i}">${esc(m[0])}</option>`).join("")}<option value="-1">Document vierge</option></select></label>
     <div class="hint" id="du_p">Les unités de travail et les risques types sont pré-remplis : il ne te reste qu’à ajuster sur le terrain.</div>
     <div class="two"><label class="f">Effectif<input id="du_e" type="number" value="${esc(e.effectif||"")}"></label><label class="f">Rédacteur (IPRP)<input id="du_r" value="Rachad MOHAMED – IPRP, 3AIM CFA"></label></div>
     <div class="err" id="du_x"></div><div><button class="btn pri" id="du_c">Créer le DUERP</button></div></div>`}`;
    if(ro)return;
    $("#du_m").onchange=()=>{const v=$("#du_m").value;$("#du_p").innerHTML=v>=0&&v!==""?"Unités pré-remplies : <b>"+DM[v][1].map(k=>esc(DU[k][0])).join(", ")+"</b>":"Les unités de travail et les risques types sont pré-remplis : il ne te reste qu’à ajuster sur le terrain."};
    $("#du_c").onclick=async()=>{const v=$("#du_m").value;if(v===""){$("#du_x").textContent="Choisis un métier ou « Document vierge ».";return}
      const units=v>=0?DM[v][1].map(k=>({id:uid("u"),nom:DU[k][0],eff:"",desc:"",risks:DU[k][1].map(newRisk)})):[];
      const d={entId:e.id,version:1,metier:v>=0?DM[v][0]:"",date:"",redacteur:$("#du_r").value.trim(),effectif:$("#du_e").value,statut:"brouillon",_o:{units}};
      $("#du_c").disabled=true;$("#du_c").textContent="Création…";
      try{await saveDu(d);V.duv=null;V.duu=0;toast("DUERP créé");renderEnt()}catch(z){$("#du_x").textContent=z.message;$("#du_c").disabled=false;$("#du_c").textContent="Créer le DUERP"}};
    return;
  }
  const d=L.find(x=>x.id===V.duv)||L[0];if(V.dutour)return panelTournee(e,d,pn);
  const o=duObj(d),U=o.units,ui=Math.min(V.duu||0,Math.max(0,U.length-1)),u=U[ui];
  const all=U.flatMap(x=>x.risks),el=all.filter(r=>LV(RN(r))==="eleve").length,late=all.filter(r=>!r.fait&&echR(r)&&jours(echR(r))<0).length,done=all.filter(r=>r.fait).length;
  const nxt=d.date?addM(d.date,12):"";
  pn.innerHTML=`<div class="card rubh" style="--rc:${DG}"><div><h2>Document unique – version ${esc(d.version)}</h2><p>${esc(d.metier||"Document vierge")} · ${d.statut==="validé"?`validé le ${fr(d.date)} · prochaine mise à jour avant le <b>${fr(nxt)}</b>`:"brouillon, non encore validé"}</p></div><div class="sp"></div>
   ${L.length>1?`<select id="du_v" style="border:1px solid var(--line);border-radius:7px;padding:7px">${L.map(x=>`<option value="${x.id}" ${x.id===d.id?"selected":""}>Version ${esc(x.version)}${x.statut==="validé"?" – "+fr(x.date):" – brouillon"}</option>`).join("")}</select>`:""}
   <button class="btn" id="du_tr">La tournée photo${PH[d.id]?" · "+PH[d.id].length:""}</button><button class="btn pri" id="du_pdf">PDF du DUERP</button>${ro?"":`${d.statut!=="validé"?`<button class="btn" id="du_val">Valider</button>`:""}<button class="btn" id="du_nv">Nouvelle version</button><button class="btn ghost" id="du_inf">Infos</button>`}</div>
  <div class="grid kpis" style="margin:0 0 14px">
   <div class="card kpi" style="--c:${DG}"><div class="n">${U.length}</div><div class="l">Unités de travail</div></div>
   <div class="card kpi" style="--c:#B42318"><div class="n" style="color:var(--bad)">${el}</div><div class="l">Risques élevés</div></div>
   <div class="card kpi" style="--c:#C17D00"><div class="n" style="color:var(--warn)">${late}</div><div class="l">Actions en retard</div></div>
   <div class="card kpi" style="--c:#1E7F4F"><div class="n" style="color:var(--ok)">${done} / ${all.length}</div><div class="l">Actions réalisées</div></div></div>
  <div class="quick" style="--rc:${DG}">${U.map((x,i)=>{const m=Math.max(0,...x.risks.map(RN)),c=LVL[LV(m)];return `<button class="chip" data-u="${i}" style="${i===ui?`border-style:solid;border-color:${DG};color:var(--ink);font-weight:600`:""}"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${x.risks.length?c[1]:"#bbb"};margin-right:6px"></span>${esc(x.nom)} · ${x.risks.length}</button>`}).join("")}${ro?"":`<button class="chip" id="du_au">+ Unité de travail</button>`}</div>
  ${u?`<div class="card" style="padding:12px 14px;margin-bottom:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-left:5px solid ${DG};border-radius:0 10px 10px 0"><div style="flex:1;min-width:200px"><b style="font-size:17px">${esc(u.nom)}</b><div class="hint">${esc([u.eff?u.eff+" salarié(s)":"",u.desc].filter(Boolean).join(" · "))}</div></div>
    ${ro?"":`<select id="du_ar" style="border:1px solid var(--line);border-radius:7px;padding:7px;max-width:260px"><option value="">+ Ajouter un risque…</option><option value="__">Risque libre</option>${[...new Set(DR.map(r=>r[1]))].map(f=>`<optgroup label="${esc(f)}">${DR.filter(r=>r[1]===f).map(r=>`<option value="${r[0]}">${esc(r[2])}</option>`).join("")}</optgroup>`).join("")}</select><button class="btn sm ghost" id="du_eu">Modifier l’unité</button>`}</div>
  <div id="du_ph"></div><div class="rows">${u.risks.slice().sort((a,b)=>RN(b)-RN(a)).map(r=>{const v=RN(r),c=LVL[LV(v)],ec=echR(r),lt=!r.fait&&ec&&jours(ec)<0;return `<div class="card row du" style="--sc:${c[1]}">
    <div class="bar"></div><div><div class="t">${esc(r.d)}</div><div class="d">${esc(r.s)}</div><div class="k">${esc(r.dm)} · existant : ${esc(r.ex||"–")}</div></div>
    <div><span class="pill" style="background:${c[2]};color:${c[1]}">${v} · ${c[0]}</span><div class="k" style="margin-top:4px">G${r.g} × F${r.f}<br>Maîtrise ${(MAI[r.m]||"–").toLowerCase()}</div></div>
    <div><div style="font-size:14px">${esc(r.ac||"")}</div><div class="k">${esc(r.resp||"Responsable à désigner")} · ${r.fait?`<b style="color:var(--ok)">réalisé le ${fr(r.fait)}</b>`:ec?`<span style="color:${lt?"var(--bad)":"inherit"}">avant le ${fr(ec)}</span>`:""}${r.fo?` · <span class="to" style="color:var(--orange)">formation ${esc(r.fo)}</span>`:""}</div></div>
    <div class="bt">${ro?"":`${r.fait?"":`<button class="btn sm" data-ok="${r.id}">Réalisé</button>`}${REG_FAM[r.fam]?`<button class="btn sm ghost" data-rg="${r.id}" title="Suivre dans le registre">→ Registre</button>`:""}<button class="btn sm ghost" data-rk="${r.id}">Modifier</button>`}</div></div>`}).join("")||`<div class="card empty">Aucun risque dans cette unité.</div>`}</div>`:`<div class="card empty">Ajoute une première unité de travail.</div>`}`;
  if($("#du_v"))$("#du_v").onchange=ev=>{V.duv=ev.target.value;V.duu=0;renderEnt()};
  pn.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{V.duu=Number(b.dataset.u);renderEnt()});
  $("#du_pdf").onclick=()=>pdfFlow(e,"Document unique – version "+d.version,()=>exportDUERP(e,d));$("#du_tr").onclick=()=>{V.dutour=true;renderEnt()};
  if(u){const st=$("#du_ph"),show=()=>{const K=(PH[d.id]||[]).filter(p=>p.keep==="oui"&&p.unit===u.id);st.innerHTML=K.length?`<div class="hint" style="margin:2px 0 4px">Constats photographiques de l’unité</div><div class="strip">${K.map(p=>`<button class="ph kept" data-ph="${p.id}"><img src="${thumbSrc(p)}" alt=""><span class="ph-n">${pnum(p.n)}</span><span class="ph-c">${esc(p.cap)}</span></button>`).join("")}</div>`:"";st.querySelectorAll("[data-ph]").forEach(b=>b.onclick=()=>photoForm(e,d,PH[d.id].find(p=>p.id===b.dataset.ph),()=>renderEnt()))};if(PH[d.id])show();else loadPhotos(d).then(show).catch(()=>{})}
  if(ro)return;
  const persist=async msg=>{try{await saveDu(d);if(msg)toast(msg);renderEnt()}catch(z){toast(z.message)}};
  if($("#du_val"))$("#du_val").onclick=()=>{if(!confirm("Valider cette version du DUERP à la date d’aujourd’hui ?"))return;d.date=today();d.statut="validé";persist("DUERP validé – mise à jour annuelle programmée")};
  $("#du_nv").onclick=async()=>{if(!confirm("Créer une nouvelle version ? L’actuelle reste conservée telle quelle."))return;
    const n={entId:e.id,version:Number(L[0].version)+1,metier:d.metier,date:"",redacteur:d.redacteur,effectif:d.effectif,statut:"brouillon",_o:JSON.parse(JSON.stringify(o))};
    try{const r=await saveDu(n);V.duv=r.id;toast("Version "+n.version+" créée");renderEnt()}catch(z){toast(z.message)}};
  $("#du_inf").onclick=()=>{const m=modal("Informations du DUERP",DG,`<div class="two"><label class="f">Effectif<input id="i_e" type="number" value="${esc(d.effectif||"")}"></label><label class="f">Date de validation<input id="i_d" type="date" value="${esc(d.date||"")}"></label></div><label class="f">Rédacteur (IPRP)<input id="i_r" value="${esc(d.redacteur||"")}"></label>${S.role==="admin"?`<button class="btn danger ghost" id="i_x" style="justify-self:start">Supprimer cette version</button>`:""}`,`<button class="btn" data-x2>Annuler</button><button class="btn pri" id="i_s">Enregistrer</button>`);
    m.ov.querySelector("[data-x2]").onclick=m.close;
    if(m.q("#i_x"))m.q("#i_x").onclick=async()=>{if(!confirm("Supprimer définitivement cette version ?"))return;await api("delDuerp",{id:d.id});S.du=S.du.filter(x=>x.id!==d.id);V.duv=null;m.close();renderEnt()};
    m.q("#i_s").onclick=()=>{d.effectif=m.q("#i_e").value;d.date=m.q("#i_d").value;if(d.date)d.statut="validé";d.redacteur=m.q("#i_r").value.trim();m.close();persist("Enregistré")}};
  $("#du_au").onclick=()=>unitForm(d,null,persist);
  if(!u)return;
  $("#du_eu").onclick=()=>unitForm(d,u,persist);
  $("#du_ar").onchange=ev=>{const k=ev.target.value;if(!k)return;const r=k==="__"?{id:uid("k"),fam:"Autre",d:"",s:"",dm:"",g:2,f:2,m:"moyenne",ex:"",ac:"",resp:"",dec:today(),delai:6,fait:"",fo:""}:newRisk(k);riskForm(d,u,r,true,persist)};
  pn.querySelectorAll("[data-rk]").forEach(b=>b.onclick=()=>riskForm(d,u,u.risks.find(r=>r.id===b.dataset.rk),false,persist));
  pn.querySelectorAll("[data-ok]").forEach(b=>b.onclick=()=>{u.risks.find(r=>r.id===b.dataset.ok).fait=today();persist("Action réalisée")});
  pn.querySelectorAll("[data-rg]").forEach(b=>b.onclick=async()=>{const r=u.risks.find(x=>x.id===b.dataset.rg),[rub,per]=REG_FAM[r.fam];
    try{const x=await api("saveEl",{el:{entId:e.id,rub,libelle:(r.ac||r.d).slice(0,70),detail:"Issu du DUERP – "+u.nom,per,dernier:"",organisme:rub==="lev"||rub==="epi"?(e.verificateur||""):"",resultat:"",ref:"",notes:"",doc:""}});S.els.push(x.el);toast("Ajouté au registre (rubrique "+RUB[rub].n+")")}catch(z){toast(z.message)}});
}
const REG_FAM={"Incendie / explosion":["inc",12],"Électricité":["inst",12],"Circulation et engins":["lev",6],"Chutes de hauteur":["epi",12],"Machines et outils":["inst",12]};
function unitForm(d,u,persist){const o=duObj(d);
  const m=modal(u?"Modifier l’unité de travail":"Nouvelle unité de travail",DG,`<label class="f">Nom de l’unité<input id="u_n" value="${esc(u?.nom||"")}" list="u_list"><datalist id="u_list">${Object.values(DU).map(x=>`<option value="${esc(x[0])}">`).join("")}</datalist></label>
   <div class="two"><label class="f">Effectif concerné<input id="u_e" type="number" value="${esc(u?.eff||"")}"></label><label class="f">Description (postes, lieux)<input id="u_d" value="${esc(u?.desc||"")}"></label></div>
   ${u?"":`<label style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox" id="u_t" checked> Pré-remplir avec les risques types si le nom correspond à une unité de la banque</label>`}<div class="err" id="u_x"></div>`,
   `${u?`<button class="btn danger ghost" id="u_del" style="margin-right:auto">Supprimer l’unité</button>`:""}<button class="btn" data-x2>Annuler</button><button class="btn pri" id="u_s">Enregistrer</button>`);
  m.ov.querySelector("[data-x2]").onclick=m.close;
  if(m.q("#u_del"))m.q("#u_del").onclick=()=>{if(!confirm("Supprimer cette unité et ses risques ?"))return;o.units=o.units.filter(x=>x!==u);V.duu=0;m.close();persist("Unité supprimée")};
  m.q("#u_s").onclick=()=>{const n=m.q("#u_n").value.trim();if(!n){m.q("#u_x").textContent="Indique le nom de l’unité.";return}
    if(u){u.nom=n;u.eff=m.q("#u_e").value;u.desc=m.q("#u_d").value.trim()}
    else{const t=Object.values(DU).find(x=>x[0]===n);o.units.push({id:uid("u"),nom:n,eff:m.q("#u_e").value,desc:m.q("#u_d").value.trim(),risks:t&&m.q("#u_t").checked?t[1].map(newRisk):[]});V.duu=o.units.length-1}
    m.close();persist("Unité enregistrée")};
}
function riskForm(d,u,r,isNew,persist){
  const sel=(id,v,opts)=>`<select id="${id}">${opts.map(([a,b])=>`<option value="${a}" ${String(v)===String(a)?"selected":""}>${b}</option>`).join("")}</select>`;
  const m=modal(isNew?"Ajouter un risque":"Modifier le risque",DG,`
   <div class="two"><label class="f">Danger / risque<input id="r_d" value="${esc(r.d)}"></label><label class="f">Famille<input id="r_fa" value="${esc(r.fam)}" list="fam_l"><datalist id="fam_l">${[...new Set(DR.map(x=>x[1]))].map(f=>`<option value="${esc(f)}">`).join("")}</datalist></label></div>
   <label class="f">Situation de travail<input id="r_s" value="${esc(r.s)}"></label>
   <label class="f">Dommage possible<input id="r_dm" value="${esc(r.dm)}"></label>
   <label class="f">Mesures de prévention existantes<input id="r_ex" value="${esc(r.ex)}"></label>
   <div class="two"><label class="f">Gravité${sel("r_g",r.g,[[1,"1 – Bénin"],[2,"2 – Sérieux (arrêt)"],[3,"3 – Grave (incapacité)"],[4,"4 – Très grave"]])}</label><label class="f">Fréquence${sel("r_f",r.f,[[1,"1 – Très rare"],[2,"2 – Rare"],[3,"3 – Fréquent"],[4,"4 – Très fréquent"]])}</label></div>
   <div class="two"><div class="calc" id="r_lv"></div><label class="f">Maîtrise du risque${sel("r_m",r.m,[["bonne","Bonne"],["moyenne","Moyenne"],["insuffisante","Insuffisante"]])}</label></div>
   <label class="f">Action à mettre en place<textarea id="r_ac" rows="2">${esc(r.ac)}</textarea></label>
   <div class="two"><label class="f">Responsable<input id="r_re" value="${esc(r.resp)}"></label><label class="f">Formation liée (3AIM CFA)<input id="r_fo" value="${esc(r.fo)}" list="fo_l"><datalist id="fo_l">${["PRAP","SST","Incendie et évacuation","Travail en hauteur","Autorisation de conduite","Habilitation électrique","AIPR","Gestion des conflits"].map(f=>`<option value="${f}">`).join("")}</datalist></label></div>
   <div class="two"><label class="f">Date de décision<input id="r_dc" type="date" value="${esc(r.dec)}"></label><label class="f">Délai (mois)<input id="r_dl" type="number" min="0" value="${esc(r.delai)}"></label></div>
   <label class="f">Réalisé le<input id="r_fa2" type="date" value="${esc(r.fait)}"></label><div class="err" id="r_x"></div>`,
   `${isNew?"":`<button class="btn danger ghost" id="r_del" style="margin-right:auto">Supprimer</button>`}<button class="btn" data-x2>Annuler</button><button class="btn pri" id="r_sv">Enregistrer</button>`);
  const lv=()=>{const v=Number(m.q("#r_g").value)*Number(m.q("#r_f").value),c=LVL[LV(v)];m.q("#r_lv").innerHTML=`Niveau de risque : <b style="color:${c[1]}">${v} – ${c[0]}</b>`};
  ["#r_g","#r_f"].forEach(s=>m.q(s).onchange=lv);lv();
  m.ov.querySelector("[data-x2]").onclick=m.close;

  g.fillStyle="#F5A623";g.font="600 44px Barlow, Arial";g.fillText("3AIM CFA",90,120);g.fillStyle="#fff";g.font="700 96px 'Barlow Condensed', Arial";g.fillText("Registre de sécurité",90,250);

/* ============ FICHIERS ============ */
async function saveFile(name,blob){
  try{if(window.claude&&window.claude.use){const dl=await window.claude.use("downloads");if(dl){await dl.save({filename:name,data:blob});return}}}catch(x){if(x&&x.code==="declined")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
const dataBlob=u=>{const [h,b]=u.split(","),bin=atob(b),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:h.slice(5).split(";")[0]})};

const toB64=f=>new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]);r.onerror=ko;r.readAsDataURL(f)});
async function uploadFile(e,f,kind){if(f.size>15e6)throw new Error("Fichier trop lourd (15 Mo maximum)");return api("upload",{entId:e.id,kind,name:f.name,mime:f.type||"application/octet-stream",data:await toB64(f)})}
async function uploadPhoto(e,f){
  if(!f)return;if(!f.type.startsWith("image/")){toast("Choisis une image");return}
  const img=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=URL.createObjectURL(f)});
  const k=Math.min(1,1400/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  const url=c.toDataURL("image/jpeg",.85);toast("Envoi de la photo…");
  try{await api("upload",{entId:e.id,kind:"photo",name:"photo_"+e.nom+".jpg",mime:"image/jpeg",data:url.split(",")[1]});S.photos[e.id]=url;e.photoId=e.photoId||"ok";renderEnt();toast("Photo enregistrée")}catch(z){toast(z.message)}
}

const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
function deposer(e,f){
  if(!f)return;$("#depf").value="";
  const m=modal("Lecture du document",RUB.id.c,`<div class="calc">${esc(f.name)}</div><p id="d_st" style="margin:0">Envoi du document…</p><div class="err" id="d_e"></div>`,`<button class="btn" data-x2>Annuler</button>`);
  m.ov.querySelector("[data-x2]").onclick=m.close;
  (async()=>{
    let u;try{u=await uploadFile(e,f,"doc")}catch(z){m.q("#d_e").textContent=z.message;return}
    m.q("#d_st").textContent="Lecture automatique du rapport en cours (15 à 30 secondes)…";
    let r=null;
    try{if(f.size>9e6)throw new Error("Fichier trop lourd pour la lecture automatique");
      r=await api("lireDoc",{entId:e.id,name:f.name,mime:f.type||"application/pdf",data:await toB64(f)})}catch(z){r={err:z.message}}
    m.close();
    if(!r||r.err||!r.items||!r.items.length){toast(r&&r.err?"Lecture automatique indisponible : saisie manuelle":"Aucune vérification reconnue : saisie manuelle");return choixManuel(e,u.url)}
    validerLecture(e,r.items,u.url);
  })();
}
function choixManuel(e,url){
  const E=els(e.id);
  const m=modal("Ce document concerne…",RUB.id.c,`<label class="f">Élément du registre<select id="d_el"><option value="">Choisir…</option>${RUBS.filter(r=>CATA[r.k]).map(r=>`<optgroup label="${r.n}">${E.filter(x=>x.rub===r.k).map(x=>`<option value="${x.id}">${esc(x.libelle)}${x.detail?" – "+esc(x.detail):""}</option>`).join("")}<option value="new:${r.k}">+ Nouvel élément (${r.n})</option></optgroup>`).join("")}</select></label><div class="err" id="d_e"></div>`,
   `<button class="btn" data-x2>Annuler</button><button class="btn pri" id="d_s">Continuer</button>`);
  m.ov.querySelector("[data-x2]").onclick=m.close;
  m.q("#d_s").onclick=()=>{const v=m.q("#d_el").value;if(!v){m.q("#d_e").textContent="Choisis l’élément concerné.";return}m.close();
    if(v.startsWith("new:"))elForm(e,{rub:v.slice(4),doc:url,dernier:today(),resultat:v.slice(4)==="form"?"":"C"});
    else{const x=S.els.find(y=>y.id===v);elForm(e,{...x,dernier:today(),resultat:x.rub==="form"?"":"C",ref:"",doc:url},true)}};
}
function trouver(e,it){
  const E=els(e.id).filter(x=>x.rub===it.rub),s=norm(it.serie);
  return (s.length>=4&&E.find(x=>norm(x.detail+" "+x.libelle).includes(s)))||E.find(x=>norm(x.libelle)===norm(it.libelle))||null;
}
function validerLecture(e,items,url){
  const L=items.map((it,i)=>{const ex=trouver(e,it);return{...it,i,ex,per:Number(it.per)||(ex?ex.per:12)}});
  const res=r=>`<span class="pill p-${r==="NC"?"nc":r==="R"?"bientot":"ok"}">${RES[r]||"–"}</span>`;
  const m=modal("Vérifié automatiquement – à valider","#B71C1C",`<p class="hint" style="margin:0">Voici ce que j’ai lu dans le document. Corrige si besoin, puis enregistre : tout est rangé dans la bonne rubrique.</p>
   ${L.map(it=>`<div class="card" style="padding:12px;border-left:5px solid ${RUB[it.rub]?.c||"#5B6474"}">
     <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>${esc(RUB[it.rub]?.n||"")}</b>${it.rub!=="form"?res(it.resultat):""}</div>
     <div class="two" style="margin-top:8px"><label class="f">Élément<input data-k="libelle" data-i="${it.i}" value="${esc(it.libelle)}"></label><label class="f">Précisions<input data-k="detail" data-i="${it.i}" value="${esc(it.detail)}"></label></div>
     <div class="two"><label class="f">Date<input type="date" data-k="dernier" data-i="${it.i}" value="${esc(it.dernier)}"></label><label class="f">Périodicité (mois)<input type="number" min="1" data-k="per" data-i="${it.i}" value="${esc(it.per)}"></label></div>
     <div class="two"><label class="f">Vérifié par<input data-k="organisme" data-i="${it.i}" value="${esc(it.organisme)}"></label><label class="f">N° rapport<input data-k="ref" data-i="${it.i}" value="${esc(it.ref)}"></label></div>
     ${(it.reserves||[]).length?`<div class="hint" style="margin-top:6px"><b>Réserves relevées :</b><br>${it.reserves.map(r=>"• "+esc(r.texte||r)).join("<br>")}</div>`:""}
     <div class="hint" style="margin-top:6px">${it.ex?`Mise à jour de l’élément existant <b>${esc(it.ex.libelle)}</b>`:"Nouvel élément ajouté au registre"}${it.ex&&it.resultat!=="NC"&&ress(e.id).some(r=>r.elId===it.ex.id&&!r.levee)?" · les réserves précédentes de cet équipement seront levées":""}</div></div>`).join("")}<div class="err" id="v_e"></div>`,
   `<button class="btn" data-x2>Annuler</button><button class="btn pri" id="v_s">Enregistrer dans le registre</button>`);
  m.ov.querySelector("[data-x2]").onclick=m.close;
  m.ov.querySelectorAll("[data-k]").forEach(inp=>inp.oninput=()=>{L[inp.dataset.i][inp.dataset.k]=inp.value});
  m.q("#v_s").onclick=async()=>{const b=m.q("#v_s");b.disabled=true;b.textContent="Enregistrement…";
    try{for(const it of L){
        const el={id:it.ex?.id||"",entId:e.id,rub:it.rub,libelle:it.libelle,detail:it.detail||it.ex?.detail||"",per:Number(it.per)||12,dernier:it.dernier,organisme:it.organisme,resultat:it.rub==="form"?"":(it.resultat||""),ref:it.ref,notes:it.notes||"",doc:url};
        const r2=await api("saveEl",{el});const k=S.els.findIndex(y=>y.id===r2.el.id);if(k>=0)S.els[k]=r2.el;else S.els.push(r2.el);
        if(it.ex&&it.resultat!=="NC")for(const o of ress(e.id).filter(r=>r.elId===it.ex.id&&!r.levee)){const x=await api("saveRes",{res:{...o,levee:it.dernier||today(),preuve:"Vérification "+(it.ref||"")+" du "+fr(it.dernier)}});const j=S.res.findIndex(y=>y.id===x.res.id);S.res[j]=x.res}
        const rs=(it.reserves||[]).map(r=>typeof r==="string"?{texte:r}:r);
        if(it.resultat==="NC"&&!rs.some(r=>/contre.?visite/i.test(r.texte)))rs.unshift({texte:"Contre-visite obligatoire avant remise en service",gravite:"haute"});
        for(const r of rs){const x=await api("saveRes",{res:{entId:e.id,elId:r2.el.id,date:it.dernier||today(),texte:`${it.libelle}${it.detail?" ("+it.detail+")":""} : ${r.texte}`,gravite:r.gravite||(it.resultat==="NC"?"haute":"moyenne"),levee:"",preuve:""}});S.res.push(x.res)}
      }
      m.close();toast(L.length>1?`${L.length} vérifications enregistrées`:"Vérification enregistrée");renderEnt();
    }catch(z){b.disabled=false;b.textContent="Enregistrer dans le registre";m.q("#v_e").textContent=z.message}};

async function etiquettes(e){await need("jspdf","qr");
  const L=els(e.id).filter(x=>["lev","epi","inst","inc"].includes(x.rub));
  if(!L.length){toast("Aucun équipement à étiqueter");return}
  if(!e.lecture){toast("Code de consultation manquant");return}
  const {jsPDF}=window.jspdf,doc=new jsPDF({unit:"mm",format:"a4"}),lw=95,lh=54,mx=7.5,my=10,gx=5,gy=3.5;
  L.forEach((x,i)=>{const k=i%10;if(i&&!k)doc.addPage();const X=mx+(k%2)*(lw+gx),Y=my+Math.floor(k/2)*(lh+gy);
    doc.setDrawColor(200,205,214);doc.setLineWidth(.3);doc.roundedRect(X,Y,lw,lh,2.5,2.5);
    for(let j=0;j<40;j++){const t=j/39;doc.setFillColor(Math.round(94+(211-94)*t),Math.round(10+(47-10)*t),Math.round(10+(47-10)*t));doc.rect(X+lw*j/40,Y,lw/40+.2,9,"F")}
    doc.setTextColor(255,255,255);doc.setFont("helvetica","bold");doc.setFontSize(8.5);doc.text("Registre de sécurité",X+4,Y+6);
    doc.setFont("helvetica","normal");doc.setFontSize(7);doc.setTextColor(255,225,200);doc.text("3AIM CFA",X+lw-4,Y+6,{align:"right"});
    doc.addImage(qrData(`${APP_URL}/?c=${e.lecture}&m=${x.id}`),"PNG",X+lw-37,Y+12,34,34);
    doc.setTextColor(20,33,61);doc.setFont("helvetica","bold");doc.setFontSize(10);doc.text(doc.splitTextToSize(P(x.libelle),54).slice(0,2),X+4,Y+16);
    doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(75,85,99);doc.text(doc.splitTextToSize(P(x.detail),54).slice(0,3),X+4,Y+26.5);
    doc.setFontSize(7.2);doc.setTextColor(122,14,14);doc.text(doc.splitTextToSize("Scannez pour voir l'état à jour : apte ou non, dernière et prochaine vérification",54),X+4,Y+40);
    doc.setTextColor(138,147,163);doc.setFontSize(6.8);doc.text(P(e.nom),X+4,Y+lh-3);
  });
  saveFile(`Etiquettes_QR_${e.nom.replace(/\W+/g,"_")}.pdf`,doc.output("blob"));
}

async function cropTo(url,ratio){ // recadrage centré au format du cadre
  url=String(url||"");if(url&&!/^(data:|blob:|https?:)/.test(url))url="data:image/jpeg;base64,"+url;
  const im=await new Promise((ok,ko)=>{const i=new Image(),t=setTimeout(()=>ko(new Error("photo illisible")),10000);i.onload=()=>{clearTimeout(t);ok(i)};i.onerror=()=>{clearTimeout(t);ko(new Error("photo illisible"))};i.src=url});
  if(!im.width||!im.height)throw new Error("photo illisible");
  let sw=im.width,sh=im.height;if(sw/sh>ratio)sw=sh*ratio;else sh=sw/ratio;
  const c=document.createElement("canvas"),k=Math.min(1,1600/sw);c.width=Math.round(sw*k);c.height=Math.round(sh*k);
  c.getContext("2d").drawImage(im,(im.width-sw)/2,(im.height-sh)/2,sw,sh,0,0,c.width,c.height);return c.toDataURL("image/jpeg",.9);
}

function hdr(doc,e,title,col,sub){

const vgDB = (() => { let p; const open = () => p || (p = new Promise((ok, ko) => { const r = indexedDB.open("reg3aim_vgp", 1); r.onupgradeneeded = () => r.result.createObjectStore("d"); r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); }));
  const tx = (m, f) => open().then(db => new Promise((ok, ko) => { const t = db.transaction("d", m), q = f(t.objectStore("d")); t.oncomplete = () => ok(q && q.result); t.onerror = () => ko(t.error); }));
  return { get: k => tx("readonly", s => s.get(k)).catch(() => null), set: (k, v) => tx("readwrite", s => s.put(v, k)).catch(() => null), del: k => tx("readwrite", s => s.delete(k)).catch(() => null) }; })();

function vgPaginate(host, R) {
  host.innerHTML = ""; let bd, curT = null, curG = null;
  const np = () => { const pg = document.createElement("div"); pg.className = "vg-pg"; pg.innerHTML = R.head + `<div class="vg-bd"></div>` + R.foot; host.appendChild(pg); bd = pg.querySelector(".vg-bd"); curT = null; curG = null; };

  const tailH = () => { const m = []; while (bd.lastElementChild && bd.lastElementChild.classList.contains("vg-h")) { m.unshift(bd.lastElementChild); bd.lastElementChild.remove(); } return m; };
  const tbl = a => { const t = document.createElement("table"); t.className = a.cls; t.innerHTML = a.th + "<tbody></tbody>"; bd.appendChild(t); curT = t; curG = a.g; };
  np();
  for (const a of R.at) {
    if (a.k === "r") {
      if (curG !== a.g) tbl(a);
      curT.tBodies[0].insertAdjacentHTML("beforeend", a.h);
      if (over()) { curT.tBodies[0].lastElementChild.remove(); if (!curT.tBodies[0].children.length) curT.remove();
        const m = tailH(); np(); m.forEach(x => bd.appendChild(x)); tbl(a); curT.tBodies[0].insertAdjacentHTML("beforeend", a.h); }
    } else {
      curG = null; const w = document.createElement("div"); w.innerHTML = a.h; const el = w.firstElementChild; bd.appendChild(el);

    }
  }
  const P = host.querySelectorAll(".vg-pg"); P.forEach((p, i) => p.querySelector(".vg-pn").textContent = `${R.num} — page ${i + 1}/${P.length}`);
  return P.length;
}

/* ---------- compteur de temps (gardé sur cet ordinateur) ---------- */
const TPS={k:"reg3aim_temps",d:null,last:Date.now(),tick:Date.now(),dirty:0};
try{TPS.d=JSON.parse(store.get(TPS.k)||"null")}catch(e){}if(!TPS.d||!TPS.d.j)TPS.d={j:{}};
["mousemove","keydown","click","scroll","touchstart","wheel"].forEach(ev=>addEventListener(ev,()=>{TPS.last=Date.now()},{passive:true,capture:true}));
const tpsFmt=s=>{s=Math.round(s/60);return s<60?s+" min":Math.floor(s/60)+" h "+String(s%60).padStart(2,"0")};
const tpsEnt=()=>V.view==="ent"?V.ent:V.view==="machine"?(S.els.find(x=>x.id===V.el)||{}).entId:null;
const tpsActif=()=>S.role==="admin"&&Date.now()-TPS.last<30*60e3;
function tpsSave(){const j=TPS.d.j,K=Object.keys(j).sort();K.slice(0,Math.max(0,K.length-400)).forEach(k=>delete j[k]);store.set(TPS.k,JSON.stringify(TPS.d));TPS.dirty=0}
setInterval(()=>{const now=Date.now(),dt=Math.min(now-TPS.tick,15000)/1000;TPS.tick=now;
  if(tpsActif()){const j=TPS.d.j[today()]=TPS.d.j[today()]||{t:0,e:{}};j.t+=dt;const id=tpsEnt();if(id)j.e[id]=(j.e[id]||0)+dt;if(++TPS.dirty>=6)tpsSave()}
  tpsPaint()},5000);
addEventListener("pagehide",()=>{if(TPS.dirty)tpsSave()});
function tpsPaint(){if(S.role!=="admin")return;const top=document.querySelector(".top .in");if(!top)return;let b=document.getElementById("tmr");
  if(!b){b=document.createElement("button");b.id="tmr";b.className="btn dk sm";b.title="Temps passé dans le registre (pause après 30 min sans activité) – clic pour le détail";b.onclick=tpsDetail;const w=top.querySelector(".who");w?top.insertBefore(b,w):top.appendChild(b)}
  const j=TPS.d.j[today()]||{t:0,e:{}},id=tpsEnt(),e=id&&S.ents.find(x=>x.id===id),a=tpsActif();
  b.textContent=(a?"⏱ ":"⏸ en pause · ")+"aujourd’hui "+tpsFmt(j.t)+(e?" · "+e.nom+" "+tpsFmt(j.e[id]||0):"");b.style.opacity=a?"1":".75"}

  const keys=p=>{const t=today(),d=new Date(t+"T00:00:00");if(p==="jour")return[t];
    if(p==="mois")return Object.keys(TPS.d.j).filter(k=>k.slice(0,7)===t.slice(0,7));
    const lu=new Date(d);lu.setDate(d.getDate()-((d.getDay()+6)%7));const s=lu.getFullYear()+"-"+String(lu.getMonth()+1).padStart(2,"0")+"-"+String(lu.getDate()).padStart(2,"0");return Object.keys(TPS.d.j).filter(k=>k>=s&&k<=t)};
  const m=modal("⏱ Temps passé dans le registre","#12213F",`<div class="quick" id="tp_p" style="margin:0 0 10px"></div><div id="tp_b"></div><p class="hint" style="margin:10px 0 0">Compté sur cet ordinateur uniquement, avec une pause automatique après 30 minutes sans activité.</p>`,`<button class="btn" data-x2>Fermer</button>`);
  m.ov.querySelector("[data-x2]").onclick=m.close;
  const draw=()=>{m.q("#tp_p").innerHTML=Object.entries(per).map(([k,l])=>`<button class="chip" data-p="${k}" style="${k===cur?"border-style:solid;font-weight:600;color:var(--ink)":""}">${l}</button>`).join("");
    m.q("#tp_p").querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{cur=b.dataset.p;draw()});
    const K=keys(cur),tot={},T=K.reduce((a,k)=>{const j=TPS.d.j[k];Object.entries(j.e||{}).forEach(([i,s])=>tot[i]=(tot[i]||0)+s);return a+(j.t||0)},0);
    const sum=Object.values(tot).reduce((a,b)=>a+b,0),rows=Object.entries(tot).sort((a,b)=>b[1]-a[1]).map(([i,s])=>[(S.ents.find(e=>e.id===i)||{}).nom||"Entreprise supprimée",s]);
    if(T-sum>=60)rows.push(["Tableau de bord et autres écrans",T-sum]);
    m.q("#tp_b").innerHTML=`<div style="font-size:22px;font-weight:600;margin-bottom:8px">Total : ${tpsFmt(T)}</div>`+(rows.length?`<div class="tbl-wrap" style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:14px">${rows.map(([n,s])=>`<tr><td style="padding:6px 8px;border-bottom:1px solid var(--line)">${esc(n)}</td><td style="padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap"><b>${tpsFmt(s)}</b></td></tr>`).join("")}</table></div>`:`<p class="hint">Rien de compté sur cette période.</p>`)};
  draw()}
const _render=render;render=function(){_render.apply(this,arguments);try{tpsPaint()}catch(z){}};

async function epShrink(src,max,q){let img;

  const W=img.width,H=img.height;if(!W||!H)throw new Error("photo vide");const k=Math.min(1,max/Math.max(W,H)),c=document.createElement("canvas");c.width=Math.round(W*k);c.height=Math.round(H*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);if(img.close)img.close();return c.toDataURL("image/jpeg",q)}

  const n=m.q("#epc_n"),som=()=>Object.values(det).reduce((a,b)=>a+b,0),maj=t=>{m.q(`[data-cv="${t}"]`).textContent=det[t]||0;if(som())n.value=som()};

async function epAnalyse(k,c){const st=c.querySelector("[data-st]"),b=c.querySelector("[data-an]");if(k.items.some(x=>x.ia)&&!confirm("Relancer l’analyse ? Le pré-rapport de "+k.nom+" proposé par Claude sera remplacé (les équipements ajoutés à la main sont gardés)."))return;

  /* sablier bien visible sur le bouton et dans la carte, avec le temps écoulé */
  const lab0=b.innerHTML,t0=Date.now();if(!document.getElementById("epprg_css"))epPrg("Préparation de l’analyse",0,1,1);
  const sab=()=>{const sec=Math.round((Date.now()-t0)/1000);b.innerHTML=`<span class="ep-sab" aria-hidden="true">⏳</span> Claude analyse… ${sec} s`;};

  b.disabled=true;const types=Object.entries(EP_T).map(([c,t])=>c+" = "+t.n).join(" ; "),N=k.photos.length,res=[];

    if(!L.length){const norm=s=>String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"");res.forEach(x=>{const s=norm(x.serie),d=s.length>=5&&s!=="ILLISIBLE"&&L.find(y=>norm(y.serie)===s&&y.type===x.type);if(d){d.photos=[...new Set([...(d.photos||[]),...(x.photos||[])])];return}L.push(x)})}

function epItemBind(k,it,box){const re=()=>{epSave();const i=k.items.indexOf(it);box.outerHTML=epItemH(k,it,i);const nb=ep$(`[data-it="${it.id}"]`);epItemBind(k,it,nb);epProg();const h=nb.closest("[data-k]").querySelector(".ep-kh .hint");if(h)h.textContent=k.items.filter(epItemOk).length+" / "+k.items.length+" vérifié(s)"};

let DOCF="tous";
async function panelDocs(e,pn){const ty={vgp:"VGP – levage",epi:"EPI antichute",duerp:"Document unique",verif:"Vérifications",form:"Formations",autre:"Autres documents"};
  pn.innerHTML=`<div class="card rubh" style="--rc:#1F5FA8"><div><h2>📁 Documents</h2><p>Tous les rapports et documents de ${esc(e.nom)}, du plus récent au plus ancien</p></div></div><div id="docl"><div class="card empty">Chargement des documents…</div></div>`;
  let ep=EPLIST[e.id];if(!ep){try{ep=EPLIST[e.id]=(await api("listEPI",{entId:e.id})).rows||[]}catch(z){ep=[]}}
  if(V.tab!=="docs"||!document.getElementById("docl"))return;
  const D=[],epDocs=new Set();
  ep.forEach(x=>{let o={};try{o=JSON.parse(x.data||"{}")}catch(z){}const d=String(x.date).slice(0,10);
    if(x.pdf){epDocs.add(x.pdf);D.push({d,t:"epi",rev:x.id,titre:`Rapport EPI N° ${x.num}${o.rev?" – rév. "+o.rev:""} – ${x.salarie}`,sous:`${(o.items||[]).length} équipement(s) · prochain contrôle avant le ${fr(addM(d,12))}`,url:x.pdf})}
    if(o.recap&&!D.some(z=>z.url===o.recap)){epDocs.add(o.recap);D.push({d,t:"epi",titre:"Récapitulatif du contrôle EPI",sous:"Tous les salariés contrôlés ce jour-là",url:o.recap,top:1})}});
  els(e.id).forEach(x=>{if(!x.doc||x.doc==="#"||epDocs.has(x.doc))return;D.push({d:String(x.dernier||x.majLe||"").slice(0,10),t:x.rub==="lev"?"vgp":x.rub==="form"?"form":x.rub==="epi"?"epi":"verif",titre:x.libelle+(x.ref?" – "+x.ref:""),sous:[x.detail,x.organisme].filter(Boolean).join(" · "),url:x.doc})});
  S.fic.filter(f=>f.entId===e.id&&f.doc&&f.doc!=="#").forEach(f=>D.push({d:String(f.date||"").slice(0,10),t:f.type==="perso"?"form":"autre",titre:f.a||"Document",sous:(FT[f.type]||{}).n||"",url:f.doc}));
  duList(e.id).filter(d=>d.statut==="validé").forEach(d=>D.push({d:String(d.date).slice(0,10),t:"duerp",titre:`Document unique – version ${d.version}`,sous:"Validé"+(d.date?" le "+fr(d.date):""),du:d.id}));
  const types=[...new Set(D.map(x=>x.t))],V2=D.filter(x=>DOCF==="tous"||x.t===DOCF).sort((a,b)=>String(b.d).localeCompare(String(a.d))||(b.top||0)-(a.top||0));
  const par={};V2.forEach(x=>(par[x.d||"sans date"]=par[x.d||"sans date"]||[]).push(x));
  const jour=d=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(d))return"Sans date";const t=new Date(d+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});return t.charAt(0).toUpperCase()+t.slice(1)};
  const ic={vgp:"🏗️",epi:"🦺",duerp:"📋",verif:"🔧",form:"🎓",autre:"📄"};
  document.getElementById("docl").innerHTML=!D.length?`<div class="card empty">Aucun document pour l’instant. Les rapports VGP, EPI, le document unique validé et les rapports déposés apparaîtront ici, rangés par date.</div>`:
   `${types.length>1?`<div class="quick" style="margin:0 0 12px">${[["tous","Tous ("+D.length+")"]].concat(types.map(t=>[t,(ic[t]||"")+" "+ty[t]+" ("+D.filter(x=>x.t===t).length+")"])).map(([k,l])=>`<button class="chip" data-df="${k}" style="${DOCF===k?"border-style:solid;border-color:#1F5FA8;color:var(--ink);font-weight:600":""}">${l}</button>`).join("")}</div>`:""}
   ${Object.keys(par).map(d=>`<div style="margin-bottom:14px"><div style="font-weight:700;font-size:15px;color:#1F5FA8;margin:0 0 6px">📅 ${esc(jour(d))}</div>
     ${par[d].map(x=>`<div class="card" style="padding:10px 14px;margin-bottom:6px;display:flex;gap:12px;align-items:center;flex-wrap:wrap"><span style="font-size:22px" aria-hidden="true">${ic[x.t]||"📄"}</span><div style="flex:1;min-width:200px"><b>${esc(x.titre)}</b><div class="hint">${esc(ty[x.t])}${x.sous?" · "+esc(x.sous):""}</div></div>
       ${x.url?`<a class="btn sm" href="${esc(x.url)}" target="_blank" rel="noopener" style="text-decoration:none">👁 Voir</a>${/drive\.google/.test(x.url)?`<a class="btn sm" href="${esc(dlUrl(x.url))}" target="_blank" rel="noopener" style="text-decoration:none">⬇ Télécharger</a>`:""}${x.rev&&S.role==="admin"?`<button class="btn sm" data-rev="${x.rev}">✏️ Compléter</button>`:""}`:`<button class="btn sm" data-ddu="${x.du}">📄 Ouvrir</button>`}</div>`).join("")}</div>`).join("")}`;
  document.querySelectorAll("[data-df]").forEach(b=>b.onclick=()=>{DOCF=b.dataset.df;panelDocs(e,pn)});
  document.querySelectorAll("[data-ddu]").forEach(b=>b.onclick=()=>{const d=S.du.find(x=>x.id===b.dataset.ddu);if(d)pfFlowDu(e,d)})}

/* ---------- compléter un rapport EPI déjà validé (révision) ---------- */
const dlUrl=u=>{const m=String(u||"").match(/\/d\/([\w-]+)/)||String(u||"").match(/[?&]id=([\w-]+)/);return m?"https://drive.google.com/uc?export=download&id="+m[1]:u};
async function epReviser(e,x,lst){EPE=e;const key="r_"+x.id,d=await epDB.get(key);
  if(d&&d.kits&&d.rev){const m=modal("Révision en cours","#E87722",`<p style="margin:0">Tu avais commencé à compléter le rapport N° ${esc(x.num)} de <b>${esc(x.salarie)}</b> sur cet appareil. Tu reprends ?</p>`,`<button class="btn" id="rvn">Recommencer</button><button class="btn pri" id="rvr">Reprendre</button>`);
    m.q("#rvr").onclick=()=>{m.close();EP=d;epOpen();epGo(1)};m.q("#rvn").onclick=async()=>{m.close();await epDB.del(key);epReviser(e,x,lst)};return}
  let o={};try{o=JSON.parse(x.data||"{}")}catch(z){}
  const kit=epKit(x.salarie);kit.items=(o.items||[]).map(it=>epNewItem({...it,ph:it.ph||[],man:{0:true,1:true,2:true}}));
  const P=o.photos||[];
  EP={v:1,date:String(x.date).slice(0,10),verif:"MOHAMED Rachad",contact:e.contact||"",kits:[kit],
    rev:{pid:x.id,num:x.num,rev:(o.rev||0)+1,nbAvant:kit.items.length,log:o.revLog||[],sansPhotos:!P.length,autres:(lst||[]).filter(y=>String(y.date).slice(0,10)===String(x.date).slice(0,10)&&y.id!==x.id)}};
  for(let i=0;i<P.length;i++){epPrg("Chargement des photos – "+x.salarie,i+1,P.length);try{const r=await api("epiPhotoGet",{fid:P[i].fid});kit.photos.push({id:P[i].id,fid:P[i].fid,d:r.data})}catch(z){}}
  if(P.length)epPrgFin(kit.photos.length+" photo(s) chargée(s)",kit.photos.length<P.length);
  kit.items.forEach(it=>it.ph=it.ph.filter(id=>kit.photos.some(p=>p.id===id)));
  await epDB.set(key,EP);epOpen();epGo(1);
  if(EP.rev.sansPhotos)toast("Ce rapport a été fait avant la sauvegarde des photos : les pièces sont reprises sans leurs photos.")}
document.addEventListener("click",ev=>{const b=ev.target.closest("[data-rev]");if(!b)return;ev.preventDefault();ev.stopPropagation();

let EP_VALID=false;
async function epValider(){if(EP_VALID)return;EP_VALID=true;try{await epValider2()}finally{EP_VALID=false}}
async function epValider2(){const K=EP.kits.filter(k=>k.items.length),A=K.flatMap(k=>k.items);
  if(!K.length)return toast("Aucun équipement à mettre dans le rapport");
  const sansNom=K.find(k=>!k.nom.trim());if(sansNom){epGo(1);return toast("Indique le nom de chaque salarié")}
  const m0=A.filter(x=>!epItemOk(x)).length;if(m0){epGo(2);return toast(m0+" équipement(s) à vérifier avant de valider")}
  const m=modal("Validation du contrôle EPI","#E87722",`<p style="margin:0" id="epst">Enregistrement dans le registre…</p><div class="err" id="eperr"></div>`,`<button class="btn" data-x2>Fermer</button>`);m.ov.querySelector("[data-x2]").onclick=m.close;const st=t=>m.q("#epst").textContent=t;
  try{if(!EP.saved){
      const aEnv=K.flatMap(k=>k.photos.filter(p=>!p.fid&&k.items.some(it=>it.ph.includes(p.id))).map(p=>({k,p})));
      for(let i=0;i<aEnv.length;i++){st(`Sauvegarde des photos dans le Drive : ${i+1} sur ${aEnv.length}…`);const {k,p}=aEnv[i];
        const r=await api("epiPhoto",{entId:EPE.id,date:EP.date,salarie:k.nom,name:`${k.nom.replace(/\W+/g,"_")}_photo_${k.photos.indexOf(p)+1}.jpg`,data:p.d});p.fid=r.fid;if(i%3===2)await epDB.set(epKey(),EP)}
      await epDB.set(epKey(),EP);st("Enregistrement dans le registre…");
      const kits=K.map(k=>{const r=epKitRes(k);const rv=EP.rev?{pid:EP.rev.pid,rev:EP.rev.rev}:{};return{...rv,salarie:k.nom,nb:r.nb,rebut:r.r,resultat:r.code,notes:r.lib.toLowerCase()+(EP.rev?" (rév. "+EP.rev.rev+")":""),
        reserves:k.items.filter(x=>x.etat!=="ok").map(x=>({texte:`${k.nom} : ${epDesig(x)} ${epRef(x)} – ${x.etat==="rebut"?"REBUT, à retirer du service et remplacer":"à surveiller"}${x.motif?" ("+x.motif+")":""}`,gravite:x.etat==="rebut"?"haute":"moyenne"})),
        data:JSON.stringify({items:k.items.map(x=>({type:x.type,marque:x.marque,modele:x.modele,serie:x.serie,fab:x.fab,fabD:x.fabD,etat:x.etat,obs:x.obs,motif:x.motif,ph:x.ph})),
          photos:k.photos.filter(p=>p.fid).map(p=>({id:p.id,fid:p.fid})),rev:EP.rev?EP.rev.rev:0,revLog:(EP.rev?EP.rev.log:[]).concat(EP.rev?[{le:today(),rev:EP.rev.rev,ajout:k.items.length-EP.rev.nbAvant}]:[])})}});
      const r=await api("saveEPI",{entId:EPE.id,date:EP.date,kits});EP.saved={nums:r.kits.map(x=>x.num+(EP.rev?" – rév. "+EP.rev.rev:"")),pids:r.kits.map(x=>x.pid)};await epDB.set(epKey(),EP)}
    if(EP.rev)K.forEach(k=>k.revInfo={le:today(),rev:EP.rev.rev,ajout:k.items.length-EP.rev.nbAvant,sansPhotos:EP.rev.sansPhotos,num:EP.rev.num});
    await need("jspdf","h2c");let off=document.getElementById("vgoff");if(!off){off=document.createElement("div");off.id="vgoff";document.body.appendChild(off)}
    const pdfDe=async(opt,lab)=>{epBuild(off,opt.nums||EP.saved.nums,opt);const{jsPDF}=window.jspdf,doc=new jsPDF({unit:"mm",format:"a4",compress:true}),P=off.querySelectorAll(".vg-pg");
      for(let i=0;i<P.length;i++){st(`${lab} : page ${i+1} sur ${P.length}…`);const c=await html2canvas(P[i],{scale:1.8,backgroundColor:"#ffffff",logging:false});if(i)doc.addPage();doc.addImage(c.toDataURL("image/jpeg",.86),"JPEG",0,0,210,297)}
      off.innerHTML="";return doc};
    const N=EP.saved.nums,base=EPE.nom.replace(/\W+/g,"_"),name=`Rapports_EPI_${N.length>1?N[0]+"_a_"+N[N.length-1]:N[0]}_${base}_${EP.date}.pdf`;
    let doc,blob,r2;
    if(EP.rev){const sauve=EP.kits,autres=EP.rev.autres.map(x=>{let o={};try{o=JSON.parse(x.data||"{}")}catch(z){}const k=epKit(x.salarie);k.items=(o.items||[]).map(it=>epNewItem({...it,ph:[]}));k._num=x.num;return k});
      const tous=autres.concat(K.map(k=>{k._num=EP.saved.nums[0];return k})).sort((a,b)=>parseInt(a._num)-parseInt(b._num));
      EP.kits=tous;try{doc=await pdfDe({recapOnly:true,nums:tous.map(k=>k._num)},"Récapitulatif mis à jour")}finally{EP.kits=sauve}
      blob=doc.output("blob");st("Classement du récapitulatif mis à jour…");r2=await api("epiPdf",{entId:EPE.id,kind:"recap",pids:EP.rev.autres.map(x=>x.id).concat(EP.saved.pids),date:EP.date,name:`Recapitulatif_EPI_${EP.date}_maj_${today()}_${base}.pdf`,data:doc.output("datauristring").split(",")[1]})}
    else{doc=await pdfDe({},"PDF récapitulatif");blob=doc.output("blob");
      st("Classement du récapitulatif dans le Drive du client…");r2=await api("epiPdf",{entId:EPE.id,kind:"recap",pids:EP.saved.pids,date:EP.date,name:"Recapitulatif_"+name,data:doc.output("datauristring").split(",")[1]})}
    for(let i=0;i<K.length;i++){if((EP.saved.kitsOk||[]).includes(i))continue;const dk=await pdfDe({only:i},`Rapport de ${K[i].nom}`);
      st(`Classement du rapport de ${K[i].nom}…`);await api("epiPdf",{entId:EPE.id,kind:"kit",pid:EP.saved.pids[i],date:EP.date,name:`Rapport_EPI_N${String(N[i]).replace(/\s*–\s*rév\.\s*/,"_rev").replace(/\W+/g,"_")}_${K[i].nom.replace(/\W+/g,"_")}_${EP.date}.pdf`,data:dk.output("datauristring").split(",")[1]});
      EP.saved.kitsOk=(EP.saved.kitsOk||[]).concat(i);await epDB.set(epKey(),EP)}
    delete EPLIST[EPE.id];
    await reload();await epDB.del(epKey());const url=URL.createObjectURL(blob);
    m.q("header h2").textContent="✅ Contrôle EPI enregistré";m.q(".bd").innerHTML=`<p style="margin:0 0 8px"><b>Rapports EPI ${N.length>1?"N° "+N[0]+" à "+N[N.length-1]:"N° "+N[0]}</b> enregistrés et classés dans le registre de ${esc(EPE.nom)}${A.some(x=>x.etat!=="ok")?", avec "+A.filter(x=>x.etat!=="ok").length+" réserve(s) à suivre":""}.</p><div id="ep_pv" style="height:55vh;overflow:auto;background:#8A93A3;border-radius:8px;padding:10px;display:grid;gap:10px;justify-items:center;align-content:start"></div>`;
    m.ov.querySelector(".modal").style.width="min(1000px,100%)";if(typeof pfApercu==="function")pfApercu(blob,m.q("#ep_pv"));
    m.ov.querySelector("footer").innerHTML=`${r2.url&&r2.url!=="#"?`<a class="btn" href="${esc(r2.url)}" target="_blank" rel="noopener" style="text-decoration:none">Ouvrir dans le Drive</a>`:""}<a class="btn" href="${url}" download="${esc(name)}" style="text-decoration:none">Télécharger le PDF</a><button class="btn pri" id="epok">✅ Voir les rapports dans le registre</button>`;
    if(EP&&EP.saved)EP.saved.done=1;
    m.q("#epok").onclick=()=>{m.close();document.getElementById("ep")?.remove();document.body.style.overflow="";EP=null;V.tab="epi";renderEnt()}}

      L.innerHTML=D.map(x=>{const h=x.d!==jour?`<div class="sb-d">📅 ${x.d?fr(x.d):"Sans date"}</div>`:"";jour=x.d;return h+`<button class="sb-i" data-sbu="${esc(x.url||"")}" data-sbdu="${x.du||""}" data-sbent="${x.ent}"><span aria-hidden="true">${ic[x.t]||"📄"}</span><div style="flex:1;min-width:0"><div class="t">${esc(x.titre)}</div><div class="k">${esc(x.nom)}</div></div></button>`}).join("")||`<p class="hint" style="padding:12px 14px">Aucun document pour l’instant.</p>`;
      L.querySelectorAll("[data-sbent]").forEach(x=>x.onclick=()=>{if(x.dataset.sbu){window.open(x.dataset.sbu,"_blank","noopener");return}const d=S.du.find(z=>z.id===x.dataset.sbdu),e=S.ents.find(z=>z.id===x.dataset.sbent);if(d&&e)pdfFlow(e,"Document unique – version "+d.version,()=>exportDUERP(e,d))})}}
  function garde(){try{localStorage.setItem("reg3aim_sb",ouvert?"1":"0")}catch(e){}}
  const _r=render;render=function(){_r.apply(this,arguments);try{dessine()}catch(z){console.warn(z)}};
  window.sbRafraichir=dessine;
  /* afficher la barre tout de suite, même pendant le chargement */
  const t0=setInterval(()=>{if(S.role){clearInterval(t0);if(!document.getElementById("sbar")&&!document.getElementById("sbtog"))try{dessine()}catch(z){}}},150);setTimeout(()=>clearInterval(t0),20000);
})();
